<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Medical Booking</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #0EA5E9; /* Sky Blue */
            --primary-dark: #0284c7;
            --accent: #10B981; /* Emerald Green */
            --bg-grad-1: #e0f2fe;
            --bg-grad-2: #f0fdf4;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --card-radius: 24px;
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e293b;
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* Background Blobs decoration */
        .blob {
            position: absolute; width: 300px; height: 300px; background: var(--primary);
            filter: blur(80px); opacity: 0.15; border-radius: 50%; z-index: -1;
            animation: moveBlob 20s infinite alternate;
        }
        .blob:nth-child(2) { right: 0; top: 0; background: var(--accent); animation-delay: -5s; }
        @keyframes moveBlob { from { transform: translate(0,0); } to { transform: translate(50px, 50px); } }

        /* HEADER */
        header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px); z-index: 100;
        }
        .brand { font-size: 1.5rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .controls i { font-size: 1.2rem; margin-left: 20px; cursor: pointer; color: var(--text-main); transition: 0.3s; padding: 8px; border-radius: 50%; background: rgba(0,0,0,0.05); }
        .controls i:hover { background: rgba(0,0,0,0.1); transform: rotate(15deg); }

        /* MAIN CONTAINER */
        .container {
            width: 100%; max-width: 480px; margin: 0 auto;
            padding: 20px; flex: 1; display: flex; flex-direction: column;
        }

        /* GLASS CARD */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 30px 25px;
            box-shadow: var(--shadow);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* QR SCANNER STYLES */
        .scan-frame {
            position: relative; border-radius: 16px; overflow: hidden;
            background: #000; margin-bottom: 20px; aspect-ratio: 1/1;
            display: none;
        }
        #qr-reader { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(255,255,255,0.3); pointer-events: none;
        }
        .scan-line {
            width: 100%; height: 2px; background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            position: absolute; top: 0;
            animation: scanMove 2s infinite linear;
        }
        @keyframes scanMove { 0% { top: 10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0; } }

        /* BUTTONS */
        .btn-main {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white; font-size: 1rem; font-weight: 700;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main:active { transform: scale(0.98); }
        .btn-secondary {
            background: rgba(16, 185, 129, 0.1); color: var(--accent);
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 15px;
        }
        .btn-secondary:hover { background: rgba(16, 185, 129, 0.2); }

        /* INPUTS */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 16px 16px 16px 50px;
            border: 2px solid transparent; background: rgba(255,255,255,0.5);
            border-radius: 16px; font-size: 1rem; font-weight: 600;
            color: var(--text-main); outline: none; transition: 0.3s;
        }
        .dark-mode .input-group input { background: rgba(0,0,0,0.2); }
        .input-group i {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-sub); font-size: 1.1rem;
        }
        .input-group input:focus {
            background: var(--glass-bg); border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }
        .input-group label {
            position: absolute; left: 50px; top: 18px; color: var(--text-sub);
            font-size: 1rem; pointer-events: none; transition: 0.3s;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -10px; left: 10px; font-size: 0.8rem;
            background: var(--primary); color: white;
            padding: 2px 8px; border-radius: 6px;
        }

        /* TICKET DESIGN (The Star) */
        .ticket-wrapper { display: none; margin-top: 10px; }
        .ticket {
            background: white; color: #333;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            position: relative;
        }
        .ticket-header {
            background: var(--primary); padding: 20px; text-align: center; color: white;
            border-bottom: 2px dashed rgba(255,255,255,0.3);
            position: relative;
        }
        /* Circles for ticket cut effect */
        .ticket-header::after, .ticket-header::before {
            content: ''; position: absolute; bottom: -10px; width: 20px; height: 20px;
            background: #e6f7ff; border-radius: 50%;
        }
        .dark-mode .ticket-header::after, .dark-mode .ticket-header::before { background: #151e32; } /* Khớp màu nền dark mode */
        
        .ticket-header::after { right: -10px; }
        .ticket-header::before { left: -10px; }

        .ticket-body { padding: 30px 20px; text-align: center; }
        .ticket-num { font-size: 5rem; font-weight: 800; line-height: 1; color: var(--primary); letter-spacing: -2px; }
        .ticket-label { text-transform: uppercase; letter-spacing: 2px; font-size: 0.7rem; color: #999; margin-top: 10px; }
        .ticket-details { margin-top: 20px; text-align: left; background: #f8f9fa; padding: 15px; border-radius: 12px; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .detail-row span:last-child { font-weight: 700; color: #333; }
        
        /* Barcode fake */
        .barcode { height: 40px; background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Code_39_243.svg/1200px-Code_39_243.svg.png'); background-size: cover; margin-top: 20px; opacity: 0.7; }

        /* ADMIN TABLE */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { text-align: left; color: var(--text-sub); font-size: 0.8rem; padding: 10px; border-bottom: 2px solid rgba(0,0,0,0.05); }
        td { padding: 15px 10px; font-weight: 600; border-bottom: 1px solid rgba(0,0,0,0.05); }
        tr:last-child td { border-bottom: none; }
        .tag { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; background: rgba(14, 165, 233, 0.1); color: var(--primary); }

        /* UTILS */
        .hidden { display: none !important; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        /* LOADING DOTS */
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite;}
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0);} 40% { color: white; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0);} 60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(0,0,0,0);} 80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white;}}

    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div class="blob"></div>
    <div class="blob"></div>

    <header>
        <div class="brand">
            <i class="fas fa-heartbeat" style="color:var(--primary); margin-right:8px;"></i> SmartCare
        </div>
        <div class="controls">
            <i class="fas fa-history" onclick="showHistory()" title="Lịch sử"></i>
            <i class="fas fa-cog" onclick="showAdminLogin()" title="Admin"></i>
            <i class="fas fa-moon" id="theme-btn" onclick="toggleTheme()"></i>
        </div>
    </header>

    <div class="container" id="app-container">
        
        <!-- WELCOME SECTION -->
        <div class="glass-card" id="form-section">
            <h2 style="margin-bottom: 5px;">Xin chào,</h2>
            <p style="color: var(--text-sub); margin-bottom: 25px;">Vui lòng lấy số thứ tự để được phục vụ.</p>

            <!-- SCANNER -->
            <div class="scan-frame" id="scan-frame">
                <div id="qr-reader"></div>
                <div class="scan-overlay">
                    <div class="scan-line"></div>
                </div>
                <button onclick="stopScanner()" style="position: absolute; bottom: 10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.5); border:none; color:white; padding:5px 15px; border-radius:20px;">Đóng Camera</button>
            </div>

            <button class="btn-main btn-secondary" onclick="startScanner()">
                <i class="fas fa-qrcode"></i> Quét CCCD Gắn Chip
            </button>

            <div style="text-align: center; margin: 15px 0; color: var(--text-sub); font-size: 0.85rem; position: relative;">
                <span style="background: var(--bg-grad-1); padding: 0 10px; z-index: 1; position: relative;">Hoặc nhập thủ công</span>
                <div style="position: absolute; top: 50%; width: 100%; height: 1px; background: rgba(0,0,0,0.1); left: 0; z-index: 0;"></div>
            </div>

            <form id="booking-form" onsubmit="handleBooking(event)">
                <div class="input-group">
                    <i class="far fa-id-card"></i>
                    <input type="number" id="cccd" placeholder=" " required>
                    <label>Số CCCD (12 số)</label>
                </div>
                
                <div class="input-group">
                    <i class="far fa-user"></i>
                    <input type="text" id="fullname" placeholder=" " required style="text-transform: uppercase;">
                    <label>Họ và tên</label>
                </div>

                <div class="input-group">
                    <i class="far fa-calendar-alt"></i>
                    <input type="date" id="birthday" required placeholder=" ">
                    <!-- Label handled by browser for date input usually, but keeping structure -->
                </div>

                <button type="submit" class="btn-main" id="btn-submit">
                    Bốc Số Ngay <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- TICKET RESULT -->
        <div class="ticket-wrapper" id="ticket-result">
            <div class="ticket">
                <div class="ticket-header">
                    <h3 style="font-weight: 600;">PHIẾU KHÁM BỆNH</h3>
                    <p style="font-size: 0.8rem; opacity: 0.8;">SmartCare Clinic</p>
                </div>
                <div class="ticket-body">
                    <div class="ticket-label">SỐ THỨ TỰ CỦA BẠN</div>
                    <div class="ticket-num" id="display-number">--</div>
                    
                    <div class="ticket-details">
                        <div class="detail-row">
                            <span>Họ tên</span>
                            <span id="display-name">...</span>
                        </div>
                        <div class="detail-row">
                            <span>CCCD</span>
                            <span id="display-cccd">...</span>
                        </div>
                        <div class="detail-row">
                            <span>Ngày khám</span>
                            <span id="display-date">...</span>
                        </div>
                        <div class="detail-row">
                            <span>Giờ lấy số</span>
                            <span id="display-time">...</span>
                        </div>
                    </div>

                    <div class="barcode"></div>
                    <p style="font-size: 0.75rem; color: #999; margin-top: 15px;">Vui lòng chụp màn hình phiếu này</p>
                </div>
            </div>
            <button class="btn-main" style="margin-top: 20px;" onclick="window.print()">
                <i class="fas fa-download"></i> Lưu / In Phiếu
            </button>
            <button class="btn-main btn-secondary" onclick="resetApp()">
                Lấy số mới
            </button>
        </div>

        <!-- ADMIN PANEL -->
        <div class="glass-card hidden" id="admin-panel" style="margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3><i class="fas fa-user-shield"></i> Quản trị viên</h3>
                <i class="fas fa-times" onclick="closeAdmin()" style="cursor: pointer; padding: 10px;"></i>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="date" id="admin-date" style="padding: 10px; border-radius: 10px; border: 1px solid #ddd; width: 100%;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-main" style="flex: 1; font-size: 0.9rem;" onclick="loadAdminData()">Xem DS</button>
                <button class="btn-main btn-secondary" style="flex: 1; margin: 0; font-size: 0.9rem;" onclick="exportExcel()">Xuất Excel</button>
            </div>

            <div class="table-container">
                <table id="admin-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên</th>
                            <th>Giờ</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        // --- 1. CONFIG ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, runTransaction, Timestamp, orderBy, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ⚠️ THAY CONFIG CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
            apiKey: "AIzaSyCLCcgaoW9gNYhKk0c0gDWC6i5mKVTN4XE",
            authDomain: "profile-d1214.firebaseapp.com",
            projectId: "profile-d1214",
            storageBucket: "profile-d1214.firebasestorage.app",
            messagingSenderId: "914980131889",
            appId: "1:914980131889:web:72f8da15c42dbee671b110"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; // Expose for non-module functions
        window.doc = doc;
        window.collection = collection;
        window.runTransaction = runTransaction;
        window.Timestamp = Timestamp;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;
        window.orderBy = orderBy;

    </script>

    <!-- APP LOGIC (Non-Module Wrapper) -->
    <script>
        let html5QrcodeScanner = null;

        // --- THEME ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-btn');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        // --- BOOKING HANDLER ---
        async function handleBooking(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const originalText = btn.innerHTML;
            
            // Get Data
            const cccd = document.getElementById('cccd').value.trim();
            const fullname = document.getElementById('fullname').value.trim().toUpperCase();
            const birthday = document.getElementById('birthday').value;
            const todayStr = new Date().toISOString().split('T')[0];

            if(cccd.length < 9) return Swal.fire('Lỗi', 'CCCD không hợp lệ', 'error');

            // UI Loading
            btn.innerHTML = 'Đang xử lý<span class="loading-dots"></span>';
            btn.disabled = true;

            try {
                // Sử dụng Transaction (Logic Firebase giữ nguyên như bản cũ nhưng viết gọn lại)
                await window.runTransaction(window.db, async (transaction) => {
                    const ticketsRef = window.collection(window.db, "tickets");
                    
                    // Check duplicate
                    const q = window.query(ticketsRef, window.where("cccd", "==", cccd), window.where("date", "==", todayStr));
                    const snapshot = await window.getDocs(q);
                    if(!snapshot.empty) throw "Hôm nay bạn đã lấy số rồi!";

                    // Get Counter
                    const counterRef = window.doc(window.db, "settings", "dailyCounter");
                    let counterDoc = await transaction.get(counterRef);
                    let newNumber = 1;

                    if (!counterDoc.exists()) {
                        transaction.set(counterRef, { currentDate: todayStr, currentNumber: 1 });
                    } else {
                        const data = counterDoc.data();
                        if (data.currentDate === todayStr) {
                            newNumber = data.currentNumber + 1;
                            transaction.update(counterRef, { currentNumber: newNumber });
                        } else {
                            transaction.update(counterRef, { currentDate: todayStr, currentNumber: 1 });
                        }
                    }

                    // Save Ticket
                    const newTicketRef = window.doc(window.db, "tickets", `${todayStr}_${cccd}`);
                    transaction.set(newTicketRef, {
                        cccd, fullname, birthday, number: newNumber, date: todayStr,
                        createdAt: window.Timestamp.now()
                    });

                    return { number: newNumber, fullname, cccd, date: todayStr };
                }).then(result => {
                    showTicket(result);
                    Swal.fire({
                        icon: 'success', title: 'Thành công', 
                        text: `Số của bạn là ${result.number}`, 
                        timer: 1500, showConfirmButton: false
                    });
                }).catch(err => {
                    Swal.fire('Thông báo', err.toString().replace("Error: ", ""), 'warning');
                });
            } catch (e) {
                console.error(e);
                Swal.fire('Lỗi', 'Có lỗi xảy ra, vui lòng thử lại', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showTicket(data) {
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('ticket-result').style.display = 'block';
            document.getElementById('ticket-result').classList.remove('hidden'); // animation trigger later if needed
            
            document.getElementById('display-number').innerText = String(data.number).padStart(3, '0');
            document.getElementById('display-name').innerText = data.fullname;
            document.getElementById('display-cccd').innerText = data.cccd;
            document.getElementById('display-date').innerText = data.date.split('-').reverse().join('/');
            
            const now = new Date();
            document.getElementById('display-time').innerText = now.getHours() + ":" + String(now.getMinutes()).padStart(2,'0');
        }

        function resetApp() {
            document.getElementById('form-section').classList.remove('hidden');
            document.getElementById('ticket-result').style.display = 'none';
            document.getElementById('booking-form').reset();
        }

        // --- SCANNER ---
        function startScanner() {
            document.getElementById('scan-frame').style.display = 'block';
            if(html5QrcodeScanner) return;

            html5QrcodeScanner = new Html5Qrcode("qr-reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    parseQR(decodedText);
                    stopScanner();
                }
            );
        }

        function stopScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    html5QrcodeScanner = null;
                    document.getElementById('scan-frame').style.display = 'none';
                });
            } else {
                 document.getElementById('scan-frame').style.display = 'none';
            }
        }

        function parseQR(qrStr) {
            // Format: 036093...||Name|...
            const parts = qrStr.split('|');
            if (parts.length >= 4) {
                document.getElementById('cccd').value = parts[0];
                document.getElementById('fullname').value = parts[2];
                // DOB convert if needed
                const dobRaw = parts[3];
                if(dobRaw.length === 8) {
                    document.getElementById('birthday').value = `${dobRaw.slice(4,8)}-${dobRaw.slice(2,4)}-${dobRaw.slice(0,2)}`;
                }
                Swal.fire({icon: 'success', title: 'Đã quét xong!', timer: 1000, showConfirmButton: false});
            } else {
                Swal.fire('Lỗi', 'QR không đúng định dạng CCCD', 'error');
            }
        }

        // --- ADMIN ---
        function showAdminLogin() {
            Swal.fire({
                title: 'Admin Access', input: 'password',
                showCancelButton: true, confirmButtonText: 'Login'
            }).then((res) => {
                if(res.isConfirmed && res.value === '123456') {
                    document.getElementById('admin-panel').classList.remove('hidden');
                    document.getElementById('admin-date').value = new Date().toISOString().split('T')[0];
                    // Scroll to admin
                    document.getElementById('admin-panel').scrollIntoView({behavior: "smooth"});
                }
            });
        }

        function closeAdmin() {
            document.getElementById('admin-panel').classList.add('hidden');
        }

        let adminData = [];
        async function loadAdminData() {
            const dateStr = document.getElementById('admin-date').value;
            const tbody = document.getElementById('admin-tbody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Đang tải...</td></tr>';

            const q = window.query(window.collection(window.db, "tickets"), window.where("date", "==", dateStr), window.orderBy("number", "asc"));
            try {
                const snapshot = await window.getDocs(q);
                adminData = [];
                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    adminData.push(d);
                    tbody.innerHTML += `
                        <tr>
                            <td><span class="tag">#${d.number}</span></td>
                            <td>${d.fullname}<br><small style="color:#888">${d.cccd}</small></td>
                            <td>${new Date(d.createdAt.seconds * 1000).getHours()}:${String(new Date(d.createdAt.seconds * 1000).getMinutes()).padStart(2,'0')}</td>
                        </tr>
                    `;
                });
                if(adminData.length === 0) tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Không có dữ liệu</td></tr>';
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="3" style="color:red; text-align:center">Cần tạo Index trên Firestore</td></tr>';
                Swal.fire('Lỗi Firestore', 'Mở Console F12 để lấy link tạo Index', 'info');
            }
        }

        function exportExcel() {
            if(!adminData.length) return Swal.fire('Trống', 'Không có dữ liệu', 'warning');
            const ws = XLSX.utils.json_to_sheet(adminData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DS_Kham");
            XLSX.writeFile(wb, "DanhSachBenhNhan.xlsx");
        }
    </script>
</body>
</html>
