<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu Lịch sử KCB BHYT (Demo)</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f4f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input[type="text"], input[type="password"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Đảm bảo padding không làm vỡ layout */
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #resultArea {
            margin-top: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
            white-space: pre-wrap; /* Giữ định dạng JSON */
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        .error { color: red; }
        .success { color: green; }
        .note {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
        .proxy-toggle {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            background: #fff3cd;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ffeeba;
        }
        .proxy-toggle input {
            margin-right: 10px;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tra cứu thông tin thẻ BHYT</h2>
    
    <div class="proxy-toggle">
        <input type="checkbox" id="useProxy" checked>
        <label for="useProxy" style="margin:0; display:inline;">
            Sử dụng Proxy trung gian (Khắc phục lỗi CORS khi chạy trên trình duyệt).<br>
            <span style="color:red; font-size:0.8em">Lưu ý: Chỉ dùng để test, không dùng proxy công cộng cho dữ liệu thật quan trọng.</span>
        </label>
    </div>

    <!-- Cấu hình tài khoản (Đã điền sẵn theo yêu cầu) -->
    <div class="section">
        <div class="section-title">1. Thông tin tài khoản kết nối (API)</div>
        <div class="form-group">
            <label>Username (Tài khoản cơ sở KCB):</label>
            <input type="text" id="apiUser" value="038071013534">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="apiPass" value="Ldhiep11061971@@">
        </div>
    </div>

    <!-- Thông tin bệnh nhân cần tra cứu -->
    <div class="section">
        <div class="section-title">2. Thông tin bệnh nhân</div>
        <div class="form-group">
            <label>Mã thẻ BHYT (15 ký tự):</label>
            <input type="text" id="maThe" placeholder="Ví dụ: DN4797912345678">
        </div>
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="hoTen" placeholder="Ví dụ: NGUYEN VAN A">
        </div>
        <div class="form-group">
            <label>Ngày sinh:</label>
            <!-- Input date trả về YYYY-MM-DD, ta sẽ cần convert sang DD/MM/YYYY -->
            <input type="date" id="ngaySinh"> 
            <div class="note">Hoặc nhập năm sinh nếu chỉ có năm (VD: 1990)</div>
        </div>
    </div>

    <button id="btnSearch" onclick="handleSearch()">Tra cứu ngay</button>
    <div id="statusMessage" style="text-align: center; margin-top: 10px;"></div>

    <div id="resultArea"></div>
</div>

<script>
    // --- CẤU HÌNH URL API ---
    // URL gốc của BHXH
    const BASE_URL = "http://egw.baohiemxahoi.gov.vn"; 
    
    // Proxy công cộng để bypass CORS (Dùng corsproxy.io làm ví dụ)
    const PROXY_URL = "https://corsproxy.io/?";

    // Hàm tiện ích: Tạo MD5 (Vì JS thuần không có sẵn MD5 ngắn gọn, đây là bản minified của thuật toán MD5)

11,1272893353),i,m,f,d[n+7],16,-155497632),i,m,f,d[n+10],23,-1094730640),i,m,f,d[n+13],4,681279174),i,m,f,d[n+0],11,-358537222),i,m,f,d[n+3],16,-722521979),i,m,f,d[n+6],23,76029189),i,m,f,d[n+9],4,-640364487),i,m,f,d[n+12],11,-421815835),i,m,f,d[n+15],16,530742520),i,m,f,d[n+2],23,-995338651),m=cmn(m,h),f=cmn(f,t),r=cmn(r,g),i=cmn(e,i)}return""+L(m)+L(f)+L(r)+L(i)}function cmn(d,_){var m=(65535&d)+(65535&_);return(d>>16)+(_>>16)+(m>>16)<<16|65535&m}function md5_ff(d,_,m,f,r,i,n){return cmn(_&m|~_&f,d,_,r,i,n)}function md5_gg(d,_,m,f,r,i,n){return cmn(_&f|m&~f,d,_,r,i,n)}function md5_hh(d,_,m,f,r,i,n){return cmn(_^m^f,d,_,r,i,n)}function md5_ii(d,_,m,f,r,i,n){return cmn(m^(_|~f),d,_,r,i,n)}function Y(d,_){d[_>>5]|=128<<_%32,d[14+(_+64>>>9<<4)]=_;for(var m=1732584193,f=-271733879,r=-1732584194,i=271733878,n=0;n<d.length;n+=16){var h=m,t=f,g=r,e=i;m=md5_ii(m=md5_ii(m=md5_ii(m=md5_ii(m=md5_hh(m=md5_hh(m=md5_hh(m=md5_hh(m=md5_gg(m=md5_gg(m=md5_gg(m=md5_gg(m=md5_ff(m=md5_ff(m=md5_ff(m=md5_ff(m,f,r,i,d[n+0],7,-680876936),f,r,i,d[n+1],12,-389564586),f,r,i,d[n+2],17,606105819),f,r,i,d[n+3],22,-1044525330),f,r,i,d[n+4],7,-176418897),f,r,i,d[n+5],12,1200080426),f,r,i,d[n+6],17,-1473231341),f,r,i,d[n+7],22,-45705983),f,r,i,d[n+8],7,1770035416),f,r,i,d[n+9],12,-1958414417),f,r,i,d[n+10],17,-42063),f,r,i,d[n+11],22,-1990404162),f,r,i,d[n+12],7,1804112514),f,r,i,d[n+13],12,-2004318071),f,r,i,d[n+14],17,-1797288840),f,r,i,d[n+15],22,1236535329),i=md5_ii(i=md5_ii(i=md5_ii(i=md5_ii(i=md5_hh(i=md5_hh(i=md5_hh(i=md5_hh(i=md5_gg(i=md5_gg(i=md5_gg(i=md5_gg(i=md5_ff(i=md5_ff(i=md5_ff(i=md5_ff(i,m,f,r,d[n+1],5,-165796510),m,f,r,d[n+6],9,-1069501632),m,f,r,d[n+11],14,643717713),m,f,r,d[n+0],20,-373897302),m,f,r,d[n+5],5,-701558691),m,f,r,d[n+10],9,38016083),m,f,r,d[n+15],14,-660478335),m,f,r,d[n+4],20,-405537848),m,f,r,d[n+9],5,568446438),m,f,r,d[n+14],9,-1019803690),m,f,r,d[n+3],14,-187363961),m,f,r,d[n+8],20,1163531501),m,f,r,d[n+13],5,-1444681467),m,f,r,d[n+2],9,-51403784),m,f,r,d[n+7],14,1735328473),m,f,r,d[n+12],20,-1926607734),r=md5_ii(r=md5_ii(r=md5_ii(r=md5_ii(r=md5_hh(r=md5_hh(r=md5_hh(r=md5_hh(r=md5_gg(r=md5_gg(r=md5_gg(r=md5_gg(r=md5_ff(r=md5_ff(r=md5_ff(r=md5_ff(r,i,m,f,d[n+5],4,-57434055),i,m,f,d[n+8],11,-2054922799),i,m,f,d[n+11],16,1873313359),i,m,f,d[n+14],23,-30611744),i,m,f,d[n+1],4,-1530992060),i,m,f,d[n+4],11,1272893353),i,m,f,d[n+7],16,-155497632),i,m,f,d[n+10],23,-1094730640),i,m,f,d[n+13],4,681279174),i,m,f,d[n+0],11,-358537222),i,m,f,d[n+3],16,-722521979),i,m,f,d[n+6],23,76029189),i,m,f,d[n+9],4,-640364487),i,m,f,d[n+12],11,-421815835),i,m,f,d[n+15],16,530742520),i,m,f,d[n+2],23,-995338651),m=cmn(m,h),f=cmn(f,t),r=cmn(r,g),i=cmn(e,i)}return""+L(m)+L(f)+L(r)+L(i)}function L(d){for(var _="",m=0;m<4;m++)_+=String.fromCharCode(255&d>>(8*m));return _}

    // Helper: Format ngày từ YYYY-MM-DD (HTML input) sang DD/MM/YYYY (API yêu cầu)
    function formatDate(dateString) {
        if(!dateString) return "";
        const parts = dateString.split("-");
        if(parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return dateString;
    }

    // Helper: Fetch with wrapper for Proxy
    async function fetchAPI(endpoint, method, body = null, queryParams = {}) {
        let url = BASE_URL + endpoint;
        const useProxy = document.getElementById('useProxy').checked;

        // Xây dựng Query String
        const queryString = Object.keys(queryParams)
            .map(key => `${encodeURIComponent(key)}=${encodeURIComponent(queryParams[key])}`)
            .join('&');
        
        if (queryString) {
            url += `?${queryString}`;
        }

        // Nếu dùng Proxy, thêm vào trước URL
        if (useProxy) {
            url = PROXY_URL + encodeURIComponent(url);
        }

        const options = {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            }
        };

        if (body) {
            options.body = JSON.stringify(body);
        }

        console.log(`Calling API: ${url}`);
        const response = await fetch(url, options);
        if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
        }
        return await response.json();
    }

    async function handleSearch() {
        const btn = document.getElementById('btnSearch');
        const status = document.getElementById('statusMessage');
        const resultArea = document.getElementById('resultArea');
        const username = document.getElementById('apiUser').value;
        const password = document.getElementById('apiPass').value;
        const maThe = document.getElementById('maThe').value;
        const hoTen = document.getElementById('hoTen').value;
        const ngaySinhRaw = document.getElementById('ngaySinh').value;

        if (!maThe || !hoTen || !ngaySinhRaw) {
            alert("Vui lòng nhập đầy đủ thông tin bệnh nhân!");
            return;
        }

        btn.disabled = true;
        resultArea.style.display = 'none';
        resultArea.innerHTML = "";
        status.innerHTML = "Đang kết nối... (Bước 1: Lấy Token)";
        status.className = "";

        try {
            // --- BƯỚC 1: LẤY TOKEN ---
            // Theo tài liệu (Page 4, 10): POST /api/token/take với body {username, password}
            const tokenData = await fetchAPI('/api/token/take', 'POST', {
                username: username,
                password: password
            });

            if (!tokenData || !tokenData.APIKey) {
                throw new Error("Không lấy được Token. Kiểm tra lại tài khoản/mật khẩu.");
            }

            const { access_token, id_token } = tokenData.APIKey;
            
            status.innerHTML = "Đã có Token. Đang tra cứu thông tin... (Bước 2)";

            // --- BƯỚC 2: TRA CỨU ---
            // Theo tài liệu (Page 7): POST /api/egw/NhanLichSuKCB2018
            // Query Params: token, id_token, username, password (dạng MD5)
            // Body: maThe, hoTen, ngaySinh
            
            // Theo hướng dẫn Code (Page 8), password trong query params phải MD5
            const passwordMD5 = MD5(password);

            const queryParams = {
                token: access_token,
                id_token: id_token,
                username: username,
                password: passwordMD5
            };

            const bodyData = {
                maThe: maThe,
                hoTen: hoTen,
                ngaySinh: formatDate(ngaySinhRaw) // Chuyển về DD/MM/YYYY
            };

            const resultData = await fetchAPI('/api/egw/NhanLichSuKCB2018', 'POST', bodyData, queryParams);

            // Hiển thị kết quả
            status.innerHTML = "Tra cứu thành công!";
            status.className = "success";
            
            // Format JSON cho đẹp
            resultArea.style.display = 'block';
            resultArea.textContent = JSON.stringify(resultData, null, 4);

        } catch (error) {
            console.error(error);
            status.innerHTML = `Lỗi: ${error.message}`;
            status.className = "error";
            if (error.message.includes("Failed to fetch") || error.message.includes("NetworkError")) {
                 status.innerHTML += "<br>Lỗi CORS. Hãy chắc chắn bạn đã tick chọn 'Sử dụng Proxy trung gian' hoặc cài Extension tắt CORS.";
            }
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
