
<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Portal 2.0</title>
    <link rel="icon" href="https://hdd.io.vn/img/bmassloadings.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { 
                        primary: '#3b82f6', 
                        accent: '#6366f1',
                        dark: '#030712',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'aurora': 'aurora 20s linear infinite',
                        'scroll-bounce': 'scrollBounce 2s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        aurora: {
                            '0%': { backgroundPosition: '50% 50%, 50% 50%' },
                            '100%': { backgroundPosition: '350% 50%, 350% 50%' },
                        },
                        scrollBounce: {
                            '0%, 20%, 50%, 80%, 100%': { transform: 'translateY(0)' },
                            '40%': { transform: 'translateY(-10px)' },
                            '60%': { transform: 'translateY(-5px)' }
                        }
                    }
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; overflow-x: hidden; }
        .dark body { background-color: #030712; color: #e2e8f0; }
        
        /* Noise Texture */
        .bg-noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Grid Background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
        }
        .dark .bg-grid {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }

        /* Spotlight Effect CSS */
        .spotlight-card {
            position: relative; overflow: hidden;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .spotlight-card {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .spotlight-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit; padding: 1px;
            background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.8), transparent 40%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        .dark .spotlight-card::before {
            background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.3), transparent 40%);
        }
        .spotlight-card:hover::before { opacity: 1; }
        
        .spotlight-bg {
            position: absolute; inset: 0;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(59, 130, 246, 0.06), transparent 40%);
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        .spotlight-card:hover .spotlight-bg { opacity: 1; }

        /* Custom Scroll */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 20px; }

        .loader { width: 48px; height: 48px; border-radius: 50%; display: inline-block; position: relative; border: 3px solid; border-color: #3b82f6 #3b82f6 transparent transparent; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Admin Sidebar */
        .admin-sidebar { transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
        .admin-sidebar.open { transform: translateX(0); }

        /* SCROLL REVEAL CLASSES */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        /* Stagger delays */
        .delay-100 { transition-delay: 0.1s; }
        .delay-200 { transition-delay: 0.2s; }
        .delay-300 { transition-delay: 0.3s; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Background Layers -->
    <div class="bg-noise z-0"></div>
    <div class="fixed inset-0 z-[-1] bg-grid mask-gradient">
        <div class="absolute top-[-10%] left-[-10%] w-[120%] h-[60%] rounded-full bg-gradient-to-r from-blue-400/20 via-purple-400/20 to-indigo-400/20 blur-[100px] animate-aurora dark:from-blue-900/20 dark:via-purple-900/20 dark:to-indigo-900/20 mix-blend-multiply dark:mix-blend-screen"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[100%] h-[50%] rounded-full bg-gradient-to-l from-emerald-400/20 to-teal-400/20 blur-[90px] dark:from-emerald-900/20 dark:to-teal-900/20 mix-blend-multiply dark:mix-blend-screen"></div>
    </div>
    <div class="fixed inset-0 z-[-1] bg-gradient-to-b from-transparent via-transparent to-white/80 dark:to-black/80 pointer-events-none"></div>

    <!-- Loading Overlay -->
    <div id="global-loading" class="fixed inset-0 bg-white dark:bg-black z-[900] flex flex-col items-center justify-center transition-opacity duration-700">
        <span class="loader mb-8"></span>
        <div class="flex flex-col items-center gap-1">
            <span class="text-sm font-extrabold tracking-[0.2em] text-slate-900 dark:text-white uppercase animate-pulse">System Boot</span>
            <span class="text-[10px] font-mono text-slate-400">Loading modules...</span>
        </div>
    </div>

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 pt-4 px-4 flex justify-center">
        <div class="w-full max-w-5xl backdrop-blur-xl bg-white/70 dark:bg-black/60 rounded-full border border-white/40 dark:border-white/10 shadow-lg shadow-black/5 px-4 py-2.5 flex justify-between items-center transition-all duration-300 hover:shadow-xl hover:bg-white/90 dark:hover:bg-black/80">
            
            <div class="flex items-center gap-3 cursor-pointer group" onclick="location.reload()">
                <div class="w-9 h-9 flex items-center justify-center bg-slate-900 dark:bg-white rounded-full text-white dark:text-black group-hover:scale-110 transition-transform duration-300">
                    <img src="https://hdd.io.vn/img/bmassloadings.png" class="w-5 h-5 object-contain invert dark:invert-0">
                </div>
                <div class="flex flex-col">
                    <h1 class="text-xs font-black uppercase tracking-wider text-slate-800 dark:text-white" id="header-title">LOADING</h1>
                </div>
            </div>

            <div class="flex items-center gap-1 md:gap-2">
                 <button onclick="window.toggleAdminSidebar()" id="admin-toggle-btn" class="hidden px-3 py-1.5 hover:bg-black/5 dark:hover:bg-white/10 rounded-full text-[10px] font-bold uppercase tracking-wide text-slate-600 dark:text-slate-300 transition-colors flex items-center gap-2">
                    <i data-lucide="settings-2" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Admin</span>
                </button>
                <div class="h-4 w-px bg-slate-200 dark:bg-white/10 mx-1"></div>
                <button onclick="window.toggleTheme()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition text-slate-600 dark:text-slate-400">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                </button>
                <div id="auth-section"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full relative z-10" id="main-content">
        <!-- JS Injected Content Here -->
    </main>

    <!-- Footer -->
    <footer class="relative z-10 pb-6 px-4 pt-10">
        <div class="max-w-5xl mx-auto backdrop-blur-2xl bg-white/40 dark:bg-slate-900/40 rounded-[2.5rem] border border-white/50 dark:border-white/5 shadow-2xl p-8 md:p-12 overflow-hidden relative reveal">
            <!-- Footer Glow -->
            <div class="absolute -top-20 -right-20 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-10 mb-10" id="footer-content"></div>
            
            <div class="border-t border-slate-200/50 dark:border-white/5 pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <p class="text-[11px] font-medium text-slate-500 dark:text-slate-500 uppercase tracking-widest">© 2024 Enterprise System.</p>
                <div class="flex items-center gap-2 px-3 py-1 bg-white/50 dark:bg-black/20 rounded-full border border-white/20 dark:border-white/5 backdrop-blur-sm">
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-[10px] font-mono text-emerald-600 dark:text-emerald-400 font-bold">OPERATIONAL</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Admin Sidebar -->
    <div id="admin-sidebar" class="admin-sidebar fixed right-0 top-0 bottom-0 w-full max-w-sm bg-white/95 dark:bg-[#0a0a0a]/95 backdrop-blur-2xl border-l border-slate-200 dark:border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.2)] z-[200] flex flex-col h-screen">
        <div class="p-6 border-b border-slate-100 dark:border-white/5 flex justify-between items-center shrink-0">
            <h3 class="font-bold text-sm tracking-wider uppercase text-slate-800 dark:text-white flex items-center gap-2">
                <span class="w-6 h-6 rounded bg-slate-900 dark:bg-white text-white dark:text-black flex items-center justify-center"><i data-lucide="command" class="w-3 h-3"></i></span>
                Control Panel
            </h3>
            <button onclick="window.toggleAdminSidebar()" class="p-2 hover:bg-slate-100 dark:hover:bg-white/10 rounded-full transition"><i data-lucide="x" class="w-4 h-4 text-slate-500"></i></button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scroll p-6 space-y-8">
            <!-- Inbox -->
            <div onclick="window.openInboxModal()" class="group relative overflow-hidden bg-gradient-to-br from-slate-900 to-slate-800 dark:from-white dark:to-slate-200 p-5 rounded-2xl shadow-xl cursor-pointer">
                <div class="absolute right-0 top-0 opacity-10 translate-x-2 -translate-y-2 group-hover:scale-110 transition-transform duration-500">
                    <i data-lucide="inbox" class="w-20 h-20 text-white dark:text-black"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center gap-2 mb-2 text-white dark:text-black">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                        <h4 class="text-xs font-black uppercase tracking-widest">Hộp thư</h4>
                    </div>
                    <p class="text-[11px] text-slate-300 dark:text-slate-600 mb-4 font-medium">Quản lý phản hồi người dùng.</p>
                    <div class="text-[10px] font-bold uppercase bg-white/20 dark:bg-black/10 text-white dark:text-black inline-flex items-center gap-2 px-3 py-1.5 rounded-lg backdrop-blur-sm group-hover:bg-white/30 transition">
                        Mở ngay <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </div>
                </div>
            </div>

            <!-- Config Form -->
            <div class="space-y-5">
                <div class="flex items-center gap-2 pb-2 border-b border-slate-100 dark:border-white/5">
                    <i data-lucide="sliders" class="w-4 h-4 text-primary"></i>
                    <h4 class="text-xs font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider">Cấu hình chung</h4>
                </div>
                <div class="space-y-3">
                    <div class="relative">
                        <i data-lucide="building" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="cfg-title1" placeholder="Đơn vị cấp trên (Tiêu đề phụ)" class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-white/5 rounded-lg text-sm border border-transparent focus:border-primary focus:bg-white dark:focus:bg-black outline-none transition font-medium">
                    </div>
                    <div class="relative">
                        <i data-lucide="layout" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="cfg-title2" placeholder="Tên hệ thống (Tiêu đề chính)" class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-white/5 rounded-lg text-sm border border-transparent focus:border-primary focus:bg-white dark:focus:bg-black outline-none transition font-medium">
                    </div>
                    <div class="relative">
                        <i data-lucide="type" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <textarea id="cfg-slogan" rows="2" placeholder="Câu slogan..." class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-white/5 rounded-lg text-sm border border-transparent focus:border-primary focus:bg-white dark:focus:bg-black outline-none transition font-medium"></textarea>
                    </div>
                </div>
            </div>

            <!-- Units List -->
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h4 class="text-xs font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider">Đơn vị</h4>
                    <button onclick="window.openUnitModal()" class="w-6 h-6 flex items-center justify-center bg-blue-500/10 text-blue-600 rounded-md hover:bg-blue-500 hover:text-white transition"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                </div>
                <div id="admin-unit-list" class="space-y-2"></div>
            </div>

             <!-- Contacts -->
            <div class="space-y-4">
                <h4 class="text-xs font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider">Liên hệ & Mạng xã hội</h4>
                <div class="space-y-2">
                    <div class="relative">
                        <i data-lucide="facebook" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="cfg-fb" placeholder="Facebook URL" class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 dark:bg-white/5 rounded-lg border-none focus:ring-1 ring-blue-500">
                    </div>
                    <div class="relative">
                        <i data-lucide="message-circle" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="cfg-zalo" placeholder="Zalo URL" class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 dark:bg-white/5 rounded-lg border-none focus:ring-1 ring-blue-500">
                    </div>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="cfg-email" placeholder="Email liên hệ" class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 dark:bg-white/5 rounded-lg border-none focus:ring-1 ring-blue-500">
                    </div>
                    <div class="relative">
                        <i data-lucide="phone" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="cfg-phone" placeholder="Số điện thoại" class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 dark:bg-white/5 rounded-lg border-none focus:ring-1 ring-blue-500">
                    </div>
                </div>
                <button onclick="window.saveGeneralConfig()" class="w-full py-3 bg-slate-900 dark:bg-white text-white dark:text-black rounded-xl text-xs font-black uppercase tracking-widest hover:shadow-lg transition flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-3.5 h-3.5"></i> Lưu Thay Đổi
                </button>
            </div>

            <!-- Modules List -->
            <div class="space-y-4 pb-10">
                <div class="flex items-center justify-between">
                    <h4 class="text-xs font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider">Modules</h4>
                    <button onclick="window.openModuleModal()" class="w-6 h-6 flex items-center justify-center bg-blue-500/10 text-blue-600 rounded-md hover:bg-blue-500 hover:text-white transition"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                </div>
                <div id="admin-module-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- INBOX MODAL -->
    <div id="modal-inbox" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[400] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#0f172a] rounded-3xl w-full max-w-3xl shadow-2xl flex flex-col max-h-[85vh] animate-slide-up border border-white/10">
            <div class="p-5 border-b border-slate-100 dark:border-white/5 flex justify-between items-center">
                <h3 class="font-bold text-sm uppercase tracking-widest">Hộp thư</h3>
                <button onclick="document.getElementById('modal-inbox').classList.add('hidden')" class="p-2 hover:bg-slate-100 dark:hover:bg-white/5 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="inbox-content" class="p-6 overflow-y-auto custom-scroll space-y-3 flex-1 bg-slate-50/50 dark:bg-black/20"></div>
        </div>
    </div>

    <!-- UNIT MODAL -->
    <div id="modal-unit" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[350] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#0f172a] rounded-3xl w-full max-w-md shadow-2xl animate-slide-up border border-white/10 overflow-hidden">
            <div class="p-5 border-b border-slate-100 dark:border-white/5 flex justify-between items-center bg-slate-50 dark:bg-white/5">
                <h3 class="font-bold text-sm uppercase tracking-widest" id="unit-modal-title">Quản lý Đơn vị</h3>
                <button onclick="document.getElementById('modal-unit').classList.add('hidden')" class="p-2 hover:bg-slate-200 dark:hover:bg-white/10 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="unit-form" class="p-6 space-y-4">
                <input type="hidden" id="unit-id">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase text-slate-400">Tên Đơn vị</label>
                    <input type="text" id="unit-name" required class="input-style w-full px-4 py-2.5 bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 rounded-xl text-sm focus:border-blue-500 outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase text-slate-400">Địa chỉ</label>
                    <input type="text" id="unit-addr" required class="input-style w-full px-4 py-2.5 bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 rounded-xl text-sm focus:border-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase text-slate-400">Lat</label>
                        <input type="text" id="unit-lat" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 rounded-xl text-sm outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase text-slate-400">Lng</label>
                        <input type="text" id="unit-lng" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 rounded-xl text-sm outline-none">
                    </div>
                </div>
                <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-white/5">
                    <input type="checkbox" id="unit-isMain" class="w-4 h-4 accent-blue-500 rounded cursor-pointer">
                    <label for="unit-isMain" class="text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer select-none">Trụ sở chính</label>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold uppercase text-xs transition shadow-lg shadow-blue-500/20">Lưu</button>
            </form>
        </div>
    </div>

    <!-- MODULE MODAL -->
    <div id="modal-module" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#0f172a] rounded-3xl w-full max-w-lg shadow-2xl animate-slide-up border border-white/10 overflow-hidden">
            <div class="p-5 border-b border-slate-100 dark:border-white/5 flex justify-between items-center bg-slate-50 dark:bg-white/5">
                <h3 class="font-bold text-sm uppercase tracking-widest" id="modal-title">Module</h3>
                <button onclick="window.closeModuleModal()" class="p-2 hover:bg-slate-200 dark:hover:bg-white/10 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="module-form" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto custom-scroll">
                <input type="hidden" id="mod-id">
                <div class="grid grid-cols-2 gap-4">
                     <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase text-slate-400">Tên hiển thị</label>
                        <input type="text" id="mod-name" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 rounded-xl text-sm outline-none focus:border-blue-500">
                    </div>
                    <div class="space-y-1">

        // --- DISTANCE LOGIC ---
        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        window.getUserLocation = () => {
            if (!navigator.geolocation) {

            showToast("Đang xác định vị trí...");
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                    renderHomepage(); 
                    showToast("Đã cập nhật vị trí!", false);
                },
                (error) => { showToast("Cần bật GPS để sử dụng tính năng này.", true); }
            );
        };

        window.openMapToUnit = (lat, lng, label) => {

            const url = isIOS ? `http://maps.apple.com/?ll=${lat},${lng}&q=${encodeURIComponent(label)}` : `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            window.open(url, '_blank');
        };

        // --- SCROLL ANIMATION OBSERVER ---
        function initScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // --- FETCH USER INFO FOR FOOTER ---
        async function fetchUserInfo() {
            let info = { ip: 'Checking...', city: 'Unknown', device: 'Unknown' };
            
            // 1. Get Device
            const ua = navigator.userAgent;
            if (/Android/i.test(ua)) info.device = "Android Device";
            else if (/iPhone|iPad|iPod/i.test(ua)) info.device = "iOS Device";
            else if (/Windows/i.test(ua)) info.device = "Windows PC";
            else if (/Mac/i.test(ua)) info.device = "Macintosh";
            else info.device = "Web Browser";

            // 2. Get IP (Free API)
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                info.ip = ipData.ip;
            } catch (e) { info.ip = 'N/A'; }

            // 3. Get Location Name (Reverse Geocoding)
            if (userLocation) {
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${userLocation.lat}&lon=${userLocation.lng}&format=json`);
                    const geoData = await geoRes.json();
                    const addr = geoData.address || {};
                    // Construct precise location
                    const parts = [];
                    if(addr.quarter) parts.push(addr.quarter);
                    if(addr.suburb) parts.push(addr.suburb);
                    if(addr.village) parts.push(addr.village);
                    if(addr.city_district) parts.push(addr.city_district);
                    if(addr.city) parts.push(addr.city);
                    else if(addr.state) parts.push(addr.state);
                    
                    info.city = parts.slice(0, 3).join(', ') || 'Đang định vị...';
                } catch (e) { info.city = 'Không thể lấy tên địa điểm'; }
            } else {
                info.city = 'Chưa cấp quyền vị trí';
            }
            return info;
        }

            // --- BUILD MAIN CONTENT ---

                             Mạng lưới hoạt động
                        </h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 font-medium max-w-lg mx-auto">Hệ thống các đơn vị trực thuộc trên toàn quốc.</p>
                        <button onclick="window.getUserLocation()" class="mt-4 px-5 py-2 bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 shadow-sm text-slate-600 dark:text-slate-300 text-[10px] font-bold rounded-full flex items-center gap-2 hover:bg-slate-50 dark:hover:bg-white/10 transition uppercase tracking-widest">
                            <i data-lucide="navigation" class="w-3 h-3 text-blue-500"></i> Tìm gần tôi
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">`;
                
                displayUnits.forEach((u, idx) => {
                    // Logic tính khoảng cách (m hoặc km) và để cạnh tên
                    let distBadge = '';
                    if (userLocation && u.distance < 9000) {
                        const distStr = u.distance < 1 
                            ? `${Math.round(u.distance * 1000)}m` 
                            : `${u.distance.toFixed(1)}km`;
                        distBadge = `<span class="ml-2 inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[10px] bg-emerald-100 text-emerald-700 font-bold dark:bg-emerald-900/50 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800"><i data-lucide="ruler" class="w-3 h-3"></i> ${distStr}</span>`;
                    }

                    const mainBadge = u.isMain 
                        ? `<span class="absolute top-4 right-4 text-[9px] font-black bg-slate-900 text-white dark:bg-white dark:text-black px-2 py-1 rounded uppercase tracking-wider z-10">HQ</span>` 
                        : '';
                    
                    html += `
                    <div class="spotlight-card reveal group p-6 rounded-2xl cursor-pointer hover:-translate-y-1 transition-transform duration-300" onclick="window.openMapToUnit(${u.lat}, ${u.lng}, '${u.name}')">
                        <div class="spotlight-bg"></div>
                        ${mainBadge}
                        <div class="relative z-10 flex items-start gap-4">
                            <div class="shrink-0 w-10 h-10 rounded-xl bg-slate-100 dark:bg-white/10 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                                <i data-lucide="building-2" class="w-5 h-5 text-slate-500 dark:text-slate-400 group-hover:text-white"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-slate-900 dark:text-white text-sm mb-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors flex items-center flex-wrap">
                                    ${u.name}
                                    ${distBadge}
                                </h4>
                                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed font-medium">${u.addr}</p>
                            </div>
                        </div>
                    </div>`;
                });
                html += `</div></div>`;
            }

            document.getElementById('main-content').innerHTML = html;
            lucide.createIcons();
            
            // Activate Spotlight & Scroll Observer
            const cards = document.querySelectorAll(".spotlight-card");
            cards.forEach(card => {
                card.onmousemove = e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty("--mouse-x", `${x}px`);
                    card.style.setProperty("--mouse-y", `${y}px`);
                };
            });
            initScrollObserver();
        }

        // --- ADMIN FUNCTIONS ---
        function fillAdminForm() {
            if(document.getElementById('cfg-title1')) document.getElementById('cfg-title1').value = configData.title1 || '';
            if(document.getElementById('cfg-title2')) document.getElementById('cfg-title2').value = configData.title2 || '';
            if(document.getElementById('cfg-slogan')) document.getElementById('cfg-slogan').value = configData.slogan || '';
            const s = configData.socials || {};
            document.getElementById('cfg-fb').value = s.facebook || '';
            document.getElementById('cfg-zalo').value = s.zalo || '';
            document.getElementById('cfg-phone').value = s.phone || '';
            document.getElementById('cfg-email').value = s.email || '';
        }

        window.saveGeneralConfig = async () => {
            if (!isAdmin) return;
            const updates = {
                title1: document.getElementById('cfg-title1').value,
                title2: document.getElementById('cfg-title2').value,
                slogan: document.getElementById('cfg-slogan').value,
                socials: {
                    facebook: document.getElementById('cfg-fb').value,
                    zalo: document.getElementById('cfg-zalo').value,
                    phone: document.getElementById('cfg-phone').value,
                    email: document.getElementById('cfg-email').value
                }
            };
            await updateFirestore(updates);
            showToast("Đã lưu Cấu hình hệ thống!");
        };

        function renderAdminUnitList() {
            const list = document.getElementById('admin-unit-list');
            list.innerHTML = (configData.units || []).map(u => `
                <div class="p-3 bg-slate-50 dark:bg-white/5 rounded-xl border border-transparent hover:border-blue-500/30 flex justify-between items-center group transition">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-xs text-slate-800 dark:text-slate-200 truncate">${u.name}</span>
                            ${u.isMain ? '<span class="text-[8px] bg-red-500 text-white px-1.5 py-0.5 rounded font-black uppercase">HQ</span>' : ''}
                        </div>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">${u.addr}</p>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="window.editUnit('${u.id}')" class="p-1.5 hover:bg-white hover:shadow-sm rounded text-blue-500"><i data-lucide="edit-2" class="w-3 h-3"></i></button>
                        <button onclick="window.deleteUnit('${u.id}')" class="p-1.5 hover:bg-white hover:shadow-sm rounded text-red-500"><i data-lucide="trash" class="w-3 h-3"></i></button>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        window.openUnitModal = () => {
            document.getElementById('unit-form').reset();
            document.getElementById('unit-id').value = '';
            document.getElementById('unit-modal-title').innerText = 'Thêm Đơn vị mới';
            document.getElementById('modal-unit').classList.remove('hidden');
        };
        window.editUnit = (id) => {
            const u = configData.units.find(x => x.id === id); if(!u) return;
            document.getElementById('unit-id').value = u.id;
            document.getElementById('unit-name').value = u.name;
            document.getElementById('unit-addr').value = u.addr;
            document.getElementById('unit-lat').value = u.lat || '';
            document.getElementById('unit-lng').value = u.lng || '';
            document.getElementById('unit-isMain').checked = u.isMain || false;
            document.getElementById('unit-modal-title').innerText = 'Chỉnh sửa Đơn vị';
            document.getElementById('modal-unit').classList.remove('hidden');
        };
        window.deleteUnit = async (id) => {
            if(!confirm("Xác nhận xóa?")) return;
            const newUnits = configData.units.filter(x => x.id !== id);
            await updateFirestore({ units: newUnits });
            showToast("Đã xóa đơn vị.");
        };
        document.getElementById('unit-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('unit-id').value || 'unit_' + Date.now();
            const newUnit = {
                id, name: document.getElementById('unit-name').value,
                addr: document.getElementById('unit-addr').value,
                lat: document.getElementById('unit-lat').value,
                lng: document.getElementById('unit-lng').value,
                isMain: document.getElementById('unit-isMain').checked
            };
            let newUnits = [...(configData.units || [])];
            if(newUnit.isMain) newUnits.forEach(u => u.isMain = false);
            const idx = newUnits.findIndex(x => x.id === id);
            if(idx >= 0) newUnits[idx] = newUnit; else newUnits.push(newUnit);
            await updateFirestore({ units: newUnits });
            showToast("Đã lưu thông tin đơn vị!");
            document.getElementById('modal-unit').classList.add('hidden');
        };

        // --- MODULE ADMIN ---
        function renderAdminModuleList() {
            document.getElementById('admin-module-list').innerHTML = configData.modules.map(m => `
                <div class="p-3 bg-slate-50 dark:bg-white/5 rounded-xl border border-transparent hover:border-blue-500/30 flex items-center justify-between gap-2 group transition">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-lg bg-white dark:bg-white/10 text-${m.color}-500 flex items-center justify-center shadow-sm"><i data-lucide="${m.icon || 'box'}" class="w-4 h-4"></i></div>
                        <span class="text-xs font-bold truncate text-slate-700 dark:text-slate-200">${m.name}</span>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition">
                        <button onclick="window.editModule('${m.id}')" class="p-1.5 text-blue-500 hover:bg-white hover:shadow-sm rounded"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                        <button onclick="window.deleteModule('${m.id}')" class="p-1.5 text-red-500 hover:bg-white hover:shadow-sm rounded"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }
        window.openModuleModal = () => {
            document.getElementById('module-form').reset();
            document.getElementById('mod-id').value = '';
            document.getElementById('modal-title').innerText = 'Thêm Module';
            window.renderIconGrid('layout-grid');
            document.getElementById('modal-module').classList.remove('hidden');
        };
        window.closeModuleModal = () => document.getElementById('modal-module').classList.add('hidden');
        window.editModule = (id) => {
            const m = configData.modules.find(x => x.id === id); if(m) {
                document.getElementById('mod-id').value = m.id;
                document.getElementById('mod-name').value = m.name;
                document.getElementById('mod-link').value = m.link;
                document.getElementById('mod-color').value = m.color;
                document.getElementById('mod-desc').value = m.desc || '';
                document.querySelector(`input[name="mod-visibility"][value="${m.visibility}"]`).checked = true;
                window.renderIconGrid(m.icon || 'box');
                document.getElementById('modal-module').classList.remove('hidden');
            }
        };
        window.deleteModule = async (id) => {
            if(confirm("Xóa module này?")) {
                await updateFirestore({ modules: configData.modules.filter(x => x.id !== id) });
                showToast("Đã xóa module.");
            }
        };
        document.getElementById('module-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('mod-id').value || 'mod_' + Date.now();
            const newMod = {
                id, name: document.getElementById('mod-name').value,
                link: document.getElementById('mod-link').value,
                icon: document.getElementById('mod-icon').value || 'box',
                color: document.getElementById('mod-color').value,
                desc: document.getElementById('mod-desc').value,
                visibility: document.querySelector('input[name="mod-visibility"]:checked').value
            };
            let newModules = [...configData.modules];
            const idx = newModules.findIndex(x => x.id === id);
            if(idx >= 0) newModules[idx] = newMod; else newModules.push(newMod);
            await updateFirestore({ modules: newModules });
            showToast("Đã lưu thiết lập module!");
            window.closeModuleModal();
        };

        // --- INBOX ---
        window.openInboxModal = async () => {
            if(!isAdmin) return;
            const contentDiv = document.getElementById('inbox-content');
            document.getElementById('modal-inbox').classList.remove('hidden');
            contentDiv.innerHTML = `<div class="flex flex-col items-center justify-center py-10 opacity-50"><span class="loader w-6 h-6 border-2 mb-2"></span><p class="text-xs">Đang tải...</p></div>`;
            const q = query(collection(db, "inbox"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            if (snapshot.empty) contentDiv.innerHTML = `<p class="text-center text-slate-400 text-sm italic py-10">Trống.</p>`;
            else {
                contentDiv.innerHTML = '';
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    const t = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleString('vi-VN') : '';
                    contentDiv.innerHTML += `
                    <div class="bg-white dark:bg-white/5 p-4 rounded-xl border border-slate-100 dark:border-white/5 shadow-sm relative">
                        <div class="flex justify-between items-start mb-2">
                            <div><h5 class="text-sm font-bold text-slate-800 dark:text-white">${d.name}</h5><p class="text-[10px] text-slate-400">${t}</p></div>
                            <button onclick="window.deleteInboxMsg('${doc.id}')" class="text-slate-300 hover:text-red-500 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                        <p class="text-[10px] text-blue-500 font-mono mb-2">${d.contact}</p>
                        <div class="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">${d.message}</div>
                    </div>`;
                });
                lucide.createIcons();
            }
        };
        window.deleteInboxMsg = async (id) => { if(confirm("Xóa tin nhắn này?")) { await deleteDoc(doc(db, "inbox", id)); window.openInboxModal(); } };
        window.handleContactSubmit = async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "inbox"), {
                    name: document.getElementById('contact-name').value,
                    contact: document.getElementById('contact-contact').value,
                    message: document.getElementById('contact-msg').value,
                    timestamp: new Date()
                });
                showToast("Đã gửi tin nhắn!", false);
                document.getElementById('contact-form').reset();
            } catch (err) { showToast("Lỗi gửi tin!", true); }
        };

        // --- UTILS ---
        window.renderIconGrid = (sel) => {
            document.getElementById('icon-selector-grid').innerHTML = presetIcons.map(i => `
                <div onclick="window.selectIcon('${i.id}')" class="cursor-pointer rounded-lg p-2 flex flex-col items-center gap-1 border transition-all ${i.id===sel?'bg-blue-500 text-white border-blue-500 shadow-md':'bg-slate-50 dark:bg-white/5 border-transparent hover:bg-slate-100 dark:hover:bg-white/10 text-slate-500'}">
                    <i data-lucide="${i.id}" class="w-4 h-4"></i>
                </div>`).join('');
            document.getElementById('mod-icon').value = sel;
            lucide.createIcons();
        };
        window.selectIcon = (id) => window.renderIconGrid(id);
        async function updateFirestore(data) { try { await setDoc(doc(db, "settings", "homepage"), data, { merge: true }); } catch (e) { showToast("Lỗi lưu dữ liệu!", true); } }
        function renderAuthUI(user) {
            const c = document.getElementById('auth-section');
            if(user) c.innerHTML = `<div class="flex items-center gap-2 pl-3 border-l border-slate-200 dark:border-white/10 cursor-pointer" onclick="window.logout()"><img src="${user.photoURL}" class="w-8 h-8 rounded-full shadow-sm ring-2 ring-white dark:ring-white/10"></div>`;
            else c.innerHTML = `<button onclick="window.login()" class="ml-2 px-3 py-1.5 bg-slate-900 dark:bg-white text-white dark:text-black rounded-lg text-[10px] font-bold uppercase tracking-wider">Login</button>`;
        }
        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());
        window.toggleAdminSidebar = () => document.getElementById('admin-sidebar').classList.toggle('open');
        window.toggleTheme = () => { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); };
        function showToast(msg, isErr=false) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            const iconBg = document.getElementById('toast-icon-bg');
            const icon = document.getElementById('toast-icon');
            if(isErr) {
                iconBg.classList.replace('from-blue-500', 'from-red-500'); iconBg.classList.replace('to-indigo-500', 'to-pink-500');
                iconBg.classList.replace('shadow-blue-500/30', 'shadow-red-500/30');
                icon.setAttribute('data-lucide', 'alert-circle');
            } else {
                iconBg.classList.replace('from-red-500', 'from-blue-500'); iconBg.classList.replace('to-pink-500', 'to-indigo-500');
                iconBg.classList.replace('shadow-red-500/30', 'shadow-blue-500/30');
                icon.setAttribute('data-lucide', 'check');
            }
            lucide.createIcons();
            t.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 3500);
        }
        if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
        lucide.createIcons();
    </script>
</body>
</html>
