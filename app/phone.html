<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh bạ Điện thoại Nội bộ</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="Hệ thống tra cứu danh bạ điện thoại nội bộ.">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/455/455705.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Excel Library (SheetJS) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#2563eb', secondary: '#f43f5e', dark: '#0f172a' } } }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; transition: background 0.3s; } 
        .dark body { background-color: #0f172a; color: #e2e8f0; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .dark .glass { background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .admin-sidebar { 
            width: 24rem; transform: translateX(100%); transition: transform 0.3s ease-in-out;
        }
        .admin-sidebar.open { transform: translateX(0); }
        @media (max-width: 768px) { .admin-sidebar { width: 100%; } }

        /* Custom Loading */
        .loader { width: 24px; height: 24px; border: 3px solid #e2e8f0; border-bottom-color: #2563eb; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Avatar Gradient */
        .avatar-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Loading Overlay -->
    <div id="global-loading" class="fixed inset-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm z-[900] flex flex-col items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
        <span class="loader mb-4"></span>
        <span id="loading-text" class="text-sm font-bold text-slate-600 dark:text-slate-300">Đang xử lý...</span>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-[100] glass px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center text-primary">
                <i data-lucide="phone-book" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-sm font-black uppercase tracking-wider">DANH BẠ ĐIỆN THOẠI</h1>
                <span id="role-status" class="text-[10px] font-bold text-slate-400">GUEST MODE</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="window.toggleAdminSidebar()" id="admin-btn" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hidden">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
            </button>
            <button onclick="window.toggleTheme()" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            </button>
            <div id="auth-section"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6 space-y-8">
        
        <!-- Search & Filter -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-end md:items-center">
            <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto flex-1">
                <!-- Search -->
                <div class="relative w-full md:w-80 group">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4 group-focus-within:text-primary transition"></i>
                    <input type="text" id="search-input" placeholder="Tìm tên hoặc số điện thoại..." 
                        class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/5 rounded-xl focus:ring-2 ring-primary/50 outline-none shadow-sm text-sm font-medium transition">
                </div>
                
                <!-- Category Filter -->
                <div class="relative w-full md:w-56">
                    <i data-lucide="building-2" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                    <select id="category-filter" onchange="window.filterDocs()" class="w-full pl-11 pr-8 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/5 rounded-xl focus:ring-2 ring-primary/50 outline-none shadow-sm text-sm font-medium appearance-none cursor-pointer">
                        <option value="all">Tất cả Phòng ban</option>
                        <!-- Options generated via JS -->
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4 pointer-events-none"></i>
                </div>
            </div>
            
            <!-- Export Button -->
            <div class="flex gap-2 shrink-0">
                <button onclick="window.exportToExcel()" class="flex items-center gap-2 px-4 py-3 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border dark:border-white/10 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-xs uppercase shadow-sm transition">
                    <i data-lucide="sheet" class="w-4 h-4 text-green-600"></i> <span class="hidden sm:inline">Xuất Excel</span>
                </button>
            </div>
        </div>

        <!-- Contact List -->
        <div id="doc-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Items rendered by JS -->
        </div>
        
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-slate-400">
            <i data-lucide="users" class="w-16 h-16 mb-4 opacity-50"></i>
            <p class="font-medium">Không tìm thấy liên hệ nào.</p>
        </div>

    </main>

    <!-- Admin Sidebar -->
    <div id="admin-sidebar" class="admin-sidebar fixed right-0 top-0 bottom-0 bg-white dark:bg-slate-900 border-l dark:border-white/10 shadow-2xl z-[200] flex flex-col">
        <div class="p-6 border-b dark:border-white/5 flex justify-between items-center">
            <h3 class="font-black uppercase text-sm tracking-widest text-primary">Quản lý Danh bạ</h3>
            <button onclick="window.toggleAdminSidebar()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div class="p-4 border-b dark:border-white/5">
            <button onclick="window.openUploadModal()" class="w-full py-3 bg-primary text-white rounded-xl font-bold uppercase text-xs shadow-lg flex items-center justify-center gap-2 hover:bg-blue-600 transition">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Thêm Liên Hệ Mới
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-8">
            <div class="space-y-4">
                <h4 class="text-xs font-black uppercase tracking-widest text-slate-500 border-b pb-2">Thống kê</h4>
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3 bg-slate-50 dark:bg-white/5 rounded-lg text-center">
                        <span id="stat-total" class="text-xl font-black text-primary block">0</span>
                        <span class="text-[10px] uppercase text-slate-400 font-bold">Tổng nhân sự</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Contact Modal -->
    <div id="modal-upload" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden border dark:border-white/10">
            <div class="p-5 border-b dark:border-white/5 flex justify-between items-center">
                <h3 class="font-bold uppercase text-sm tracking-widest">Thêm Nhân sự</h3>
                <button onclick="window.closeModal('modal-upload')" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="upload-form" class="p-6 space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Họ và Tên <span class="text-red-500">*</span></label>
                    <input type="text" id="contact-name" required placeholder="Nguyễn Văn A" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                </div>
                
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Số điện thoại <span class="text-red-500">*</span></label>
                    <input type="tel" id="contact-phone" required placeholder="09xxxxxxxxx" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Chức vụ</label>
                        <input type="text" id="contact-position" placeholder="Nhân viên" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Phòng ban</label>
                        <select id="contact-department" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary appearance-none">
                            <!-- JS Generated -->
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-primary text-white rounded-xl font-bold shadow-lg uppercase text-xs hover:bg-blue-600 transition">Lưu Liên Hệ</button>
            </form>
        </div>
    </div>

    <!-- Edit Contact Modal -->
    <div id="modal-edit" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden border dark:border-white/10">
            <div class="p-5 border-b dark:border-white/5 flex justify-between items-center">
                <h3 class="font-bold uppercase text-sm tracking-widest text-primary">Chỉnh sửa Thông tin</h3>
                <button onclick="window.closeModal('modal-edit')" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="edit-form" class="p-6 space-y-4">
                <input type="hidden" id="edit-id">
                
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Họ và Tên <span class="text-red-500">*</span></label>
                    <input type="text" id="edit-name" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                </div>
                
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Số điện thoại <span class="text-red-500">*</span></label>
                    <input type="tel" id="edit-phone" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Chức vụ</label>
                        <input type="text" id="edit-position" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Phòng ban</label>
                        <select id="edit-department" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary appearance-none">
                            <!-- JS Generated -->
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-primary text-white rounded-xl font-bold shadow-lg uppercase text-xs hover:bg-blue-600 transition">Cập nhật</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-[500] translate-y-20 opacity-0 transition-all duration-300">
        <div class="bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-bold text-sm">
            <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>
            <span id="toast-msg">Thông báo</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- CẤU HÌNH FIREBASE CỦA BẠN ---
        // Hãy thay thế bằng config từ Firebase Console của bạn
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.firebasestorage.app",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // --- DANH SÁCH PHÒNG BAN ---
        const DEPARTMENTS = [
            "Ban Giám Đốc",
            "Phòng Hành chính - Nhân sự",
            "Phòng Kế toán",
            "Phòng Kinh doanh",
            "Phòng Kỹ thuật",
            "Kho vận",
            "Bảo vệ",
            "Khác"
        ];

        // Init Firebase
        let app, auth, db, provider;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();
        } catch (e) {
            console.error("Lỗi khởi tạo Firebase. Hãy chắc chắn bạn đã điền đúng Config.", e);
        }

        let currentUser = null;
        let isAdmin = false;
        let contacts = [];

        // Init UI Data
        function initDepartmentSelects() {
            const opts = DEPARTMENTS.map(c => `<option value="${c}">${c}</option>`).join('');
            
            // Filter
            const filter = document.getElementById('category-filter');
            filter.innerHTML = `<option value="all">Tất cả Phòng ban</option>` + opts;
            
            // Add Modal
            document.getElementById('contact-department').innerHTML = opts;
            document.getElementById('contact-department').value = "Khác";
            
            // Edit Modal
            document.getElementById('edit-department').innerHTML = opts;
        }
        initDepartmentSelects();

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            renderAuthUI();
            
            if (user) {
                // Kiểm tra Admin (Cần tạo collection 'settings' doc 'admins' trên Firestore nếu muốn phân quyền kỹ)
                // Ở đây mình tạm cho tất cả ai đăng nhập đều là admin để test, bạn có thể sửa logic này
                isAdmin = true; 
                
                if (isAdmin) {
                    document.getElementById('admin-btn').classList.remove('hidden');
                    document.getElementById('role-status').innerText = "QUẢN TRỊ VIÊN";
                    document.getElementById('role-status').classList.add('text-primary');
                }
            } else {
                isAdmin = false;
                document.getElementById('admin-btn').classList.add('hidden');
                document.getElementById('role-status').innerText = "KHÁCH";
                document.getElementById('role-status').classList.remove('text-primary');
            }
            renderContacts();
        });

        // --- UI LOGIC ---
        function renderAuthUI() {
            const container = document.getElementById('auth-section');
            if (currentUser) {
                container.innerHTML = `
                    <div class="flex items-center gap-2 bg-white dark:bg-slate-800 p-1 pr-3 rounded-xl border dark:border-white/10 shadow-sm cursor-pointer" onclick="window.logout()">
                        <img src="${currentUser.photoURL}" class="w-8 h-8 rounded-lg">
                        <div class="hidden sm:block">
                            <p class="text-[10px] font-bold text-slate-400 uppercase leading-none">Hi,</p>
                            <p class="text-xs font-bold leading-none truncate max-w-[100px]">${currentUser.displayName}</p>
                        </div>
                        <i data-lucide="log-out" class="w-4 h-4 text-red-500 ml-1"></i>
                    </div>
                `;
            } else {
                container.innerHTML = `<button onclick="window.login()" class="px-5 py-2 bg-primary text-white rounded-xl font-bold text-xs uppercase shadow-lg hover:bg-blue-600 transition">Đăng nhập Admin</button>`;
            }
            lucide.createIcons();
        }

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());
        window.toggleAdminSidebar = () => document.getElementById('admin-sidebar').classList.toggle('open');
        window.toggleTheme = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        };
        
        // --- REALTIME DATA ---
        if (db) {
            onSnapshot(query(collection(db, "contacts"), orderBy("name", "asc")), (snap) => {
                contacts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('stat-total').innerText = contacts.length;
                renderContacts();
            });
        }

        window.filterDocs = renderContacts; // Bind filter change

        function getInitials(name) {
            return name.split(' ').pop().charAt(0).toUpperCase();
        }

        function renderContacts() {
            const container = document.getElementById('doc-container');
            const search = document.getElementById('search-input').value.toLowerCase();
            const catFilter = document.getElementById('category-filter').value;
            
            const filtered = contacts.filter(d => {
                const matchSearch = d.name.toLowerCase().includes(search) || d.phone.includes(search);
                const matchCat = catFilter === 'all' || (d.department || 'Khác') === catFilter;
                return matchSearch && matchCat;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            
            document.getElementById('empty-state').classList.add('hidden');
            container.innerHTML = filtered.map(contact => {
                const initial = getInitials(contact.name);
                const contactStr = encodeURIComponent(JSON.stringify(contact));

                return `
                <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border dark:border-white/5 shadow-sm hover:shadow-lg transition group relative overflow-hidden">
                    <div class="flex items-start gap-4">
                        <!-- Avatar -->
                        <div class="w-14 h-14 rounded-full avatar-gradient flex items-center justify-center text-xl font-bold shadow-inner flex-shrink-0">
                            ${initial}
                        </div>
                        
                        <!-- Info -->
                        <div class="flex-1 min-w-0">
                            <h4 class="text-base font-bold text-slate-800 dark:text-slate-100 truncate">${contact.name}</h4>
                            <p class="text-xs font-semibold text-primary mb-1 truncate">${contact.position || 'Nhân viên'}</p>
                            <div class="flex items-center gap-1 text-[11px] text-slate-500 dark:text-slate-400 font-medium bg-slate-100 dark:bg-slate-700 w-fit px-2 py-0.5 rounded-md">
                                <i data-lucide="building-2" class="w-3 h-3"></i> ${contact.department || 'Khác'}
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t dark:border-white/5 flex items-center justify-between">
                        <a href="tel:${contact.phone}" class="flex items-center gap-2 text-lg font-bold text-slate-700 dark:text-slate-200 hover:text-primary transition">
                            <i data-lucide="phone-call" class="w-5 h-5 text-primary"></i> ${contact.phone}
                        </a>
                        
                        <div class="flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                            ${isAdmin ? `
                            <button onclick="window.openEditModal('${contactStr}')" class="p-2 text-indigo-500 bg-indigo-50 dark:bg-slate-700 hover:bg-indigo-100 rounded-lg transition" title="Sửa"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="window.deleteContact('${contact.id}', '${contact.name}')" class="p-2 text-red-500 bg-red-50 dark:bg-slate-700 hover:bg-red-100 rounded-lg transition" title="Xóa"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            ` : ''}
                            <button onclick="window.copyPhone('${contact.phone}')" class="p-2 text-slate-500 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded-lg transition" title="Copy"><i data-lucide="copy" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }
        
        document.getElementById('search-input').oninput = renderContacts;

        // --- CRUD LOGIC ---
        
        // 1. ADD
        window.openUploadModal = () => {
            document.getElementById('modal-upload').classList.remove('hidden');
        };
        
        window.closeModal = (id) => {
            document.getElementById(id).classList.add('hidden');
        };

        document.getElementById('upload-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('contact-name').value;
            const phone = document.getElementById('contact-phone').value;
            const position = document.getElementById('contact-position').value;
            const department = document.getElementById('contact-department').value;

            setLoading(true);
            try {
                await addDoc(collection(db, "contacts"), {
                    name, phone, position, department,
                    timestamp: new Date().toISOString(),
                    updatedBy: currentUser.email
                });
                showToast("Thêm liên hệ thành công!");
                window.closeModal('modal-upload');
                document.getElementById('upload-form').reset();
            } catch (error) {
                showToast("Lỗi: " + error.message, true);
            } finally {
                setLoading(false);
            }
        };

        // 2. EDIT
        window.openEditModal = (str) => {
            const data = JSON.parse(decodeURIComponent(str));
            document.getElementById('edit-id').value = data.id;
            document.getElementById('edit-name').value = data.name;
            document.getElementById('edit-phone').value = data.phone;
            document.getElementById('edit-position').value = data.position;
            document.getElementById('edit-department').value = data.department;
            document.getElementById('modal-edit').classList.remove('hidden');
        };

        document.getElementById('edit-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            const phone = document.getElementById('edit-phone').value;
            const position = document.getElementById('edit-position').value;
            const department = document.getElementById('edit-department').value;

            setLoading(true, "Đang cập nhật...");
            try {
                await updateDoc(doc(db, "contacts", id), {
                    name, phone, position, department
                });
                showToast("Đã cập nhật thông tin!");
                window.closeModal('modal-edit');
            } catch (error) {
                showToast("Lỗi: " + error.message, true);
            } finally {
                setLoading(false);
            }
        };

        // 3. DELETE
        window.deleteContact = async (id, name) => {
            if(confirm(`Xóa liên hệ "${name}"? Hành động này không thể hoàn tác.`)) {
                setLoading(true);
                try {
                    await deleteDoc(doc(db, "contacts", id));
                    showToast("Đã xóa liên hệ!");
                } catch (error) {
                    showToast("Lỗi: " + error.message, true);
                } finally {
                    setLoading(false);
                }
            }
        };

        // --- UTILITIES ---
        window.copyPhone = (phone) => {
            navigator.clipboard.writeText(phone).then(() => showToast("Đã sao chép số điện thoại!"));
        };

        window.exportToExcel = () => {
            if (contacts.length === 0) { showToast("Không có dữ liệu!", true); return; }
            const data = contacts.map((d, i) => ({
                STT: i + 1,
                "Họ và Tên": d.name,
                "Số điện thoại": d.phone,
                "Chức vụ": d.position,
                "Phòng ban": d.department
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Danh bạ");
            XLSX.writeFile(wb, `Danh_Ba_Dien_Thoai_${Date.now()}.xlsx`);
            showToast("Đã xuất file Excel!");
        };

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            icon.setAttribute('data-lucide', isError ? 'alert-triangle' : 'check-circle');
            icon.classList.toggle('text-red-500', isError);
            icon.classList.toggle('text-green-500', !isError);
            lucide.createIcons();
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function setLoading(active, text = "Đang xử lý...") {
            const l = document.getElementById('global-loading');
            document.getElementById('loading-text').innerText = text;
            active ? l.classList.remove('opacity-0', 'pointer-events-none') : l.classList.add('opacity-0', 'pointer-events-none');
        }

        if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
        lucide.createIcons();
    </script>
</body>
</html>
