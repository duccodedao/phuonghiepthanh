<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HongDuc Dev</title>

    <meta name="description" content="Cổng thông tin nhân sự.">
    <link rel="icon" type="image/png" href="https://hdd.io.vn/img/bmassloadings.png">
    <link rel="apple-touch-icon" href="https://hdd.io.vn/img/bmassloadings.png">

    <!-- Libs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: 1px solid rgba(255, 255, 255, 0.4);
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --sidebar-width: 280px;
            --primary-color: #6c5ce7;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
            background-image: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            color: #2d3436;
            overflow-x: hidden;
        }

        .main-layout { display: flex; min-height: 100vh; transition: all 0.3s ease; }

        .sidebar {
            width: var(--sidebar-width);
            background: rgba(255, 255, 255, 0.98);
            height: 100vh;
            position: fixed; top: 0; left: 0; z-index: 1060;
            padding: 25px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.05);
            transform: translateX(-100%); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .sidebar.active { transform: translateX(0) !important; }

        .content-area {
            flex-grow: 1; padding: 20px; width: 100%;
            transition: margin-left 0.3s ease; margin-left: 0; 
            overflow-x: hidden;
        }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1050; display: none; backdrop-filter: blur(2px);
        }
        .sidebar-overlay.show { display: block; }

        .mobile-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1040;
            background: white; border: none; padding: 10px 14px;
            border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: var(--primary-color); display: none; transition: transform 0.2s;
        }
        .mobile-toggle:active { transform: scale(0.95); }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border-radius: 20px;
            border: var(--glass-border); box-shadow: var(--shadow-soft); padding: 25px;
        }

        .form-control, .form-select {
            border-radius: 12px; padding: 12px;
            border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.8);
        }
        .form-control:focus {
            background: white; border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        
        .form-control:disabled, .form-select:disabled {
            background-color: #e9ecef;
            opacity: 1;
        }

        .btn-gradient {
            background: var(--primary-gradient); border: none; color: white;
            border-radius: 12px; padding: 12px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3); transition: 0.2s;
        }
        .btn-gradient:hover { transform: translateY(-2px); color: white; }
        .btn-gradient:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }

        .table-responsive {
            overflow-x: auto !important; -webkit-overflow-scrolling: touch;
            border-radius: 16px; background: white; box-shadow: var(--shadow-soft);
        }
        .custom-table { min-width: 900px; margin-bottom: 0; }
        .custom-table th {
            background: #f8f9fa; color: #636e72; font-weight: 600;
            font-size: 0.8rem; padding: 15px; border: none; white-space: nowrap;
            position: sticky; top: 0; z-index: 10;
        }
        .custom-table td { 
            padding: 15px; vertical-align: middle; 
            border-bottom: 1px solid #f1f2f6; white-space: nowrap; 
        }

        .glass-popup {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px) !important;
            border-radius: 20px !important;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1) !important;
        }
        .history-item { border-left: 3px solid #6c5ce7; transition: all 0.2s; }
        .history-item:hover { transform: translateX(5px); background: white !important; }

        .form-switch .form-check-input { width: 3em; height: 1.5em; cursor: pointer; }
        .form-switch .form-check-input:checked { background-color: #6c5ce7; border-color: #6c5ce7; }

        @media (min-width: 992px) {
            .sidebar.desktop-visible { transform: translateX(0); }
            .content-area.desktop-shifted { margin-left: var(--sidebar-width); }
            .mobile-toggle { display: none !important; } 
        }
        @media (max-width: 991px) {
            .sidebar { transform: translateX(-100%); }
            .content-area { margin-left: 0 !important; }
        }
    </style>
</head>
<body>

    <div id="loading" style="position: fixed; inset:0; background:rgba(255,255,255,0.9); z-index:9999; display:none; align-items:center; justify-content:center;">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <button class="mobile-toggle animate__animated animate__fadeInLeft" id="sidebarToggle">
        <i class="fas fa-bars fa-lg"></i>
    </button>

    <div class="main-layout">
        
        <!-- SIDEBAR -->
        <nav class="sidebar" id="sidebar">
            <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center me-3 shadow-sm" style="width: 40px; height: 40px;">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div style="overflow: hidden;">
                    <h6 class="fw-bold m-0 text-dark">Admin Panel</h6>
                    <small class="text-muted text-truncate d-block" id="adminNameDisplay">Xin chào</small>
                </div>
            </div>

            <div class="d-grid gap-2 mb-auto">
                <button class="btn btn-light text-start py-3 fw-bold text-primary active" onclick="closeSidebarMobile()">
                    <i class="fas fa-chart-pie me-3"></i>Dashboard
                </button>
                <button class="btn btn-light text-start py-3" onclick="closeSidebarMobile(); document.getElementById('fileExcel').click()">
                    <i class="fas fa-file-import me-3"></i>Import Excel
                    <input type="file" id="fileExcel" hidden accept=".xlsx" onchange="handleImport()">
                </button>
                <button class="btn btn-light text-start py-3" onclick="closeSidebarMobile(); exportExcel()">
                    <i class="fas fa-file-export me-3"></i>Xuất báo cáo
                </button>
                
                <div id="adminSettingsArea" class="bg-light p-3 rounded-3 mt-2 d-none">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="toggleEditPermission">
                        <label class="form-check-label fw-bold small text-muted" for="toggleEditPermission">Cho phép sửa hồ sơ</label>
                    </div>
                </div>

                <div class="border-top my-2"></div>
                <button class="btn btn-outline-secondary text-start py-2" onclick="switchViewMode('user')">
                    <i class="fas fa-arrow-left me-3"></i>Về trang nhập liệu
                </button>
            </div>

            <div class="mt-3">
                <button class="btn btn-danger w-100 py-2 rounded-3" id="btnLogout">
                    <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                </button>
            </div>
        </nav>

        <!-- CONTENT AREA -->
        <div class="content-area" id="contentArea">

            <!-- A. USER VIEW -->
            <div id="userView" class="container pt-4" style="max-width: 600px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-dark m-0">HongDuc</h4>
                    <button class="btn btn-sm btn-dark rounded-pill px-3 shadow animate__animated animate__fadeIn" id="btnToAdmin" style="display: none;" onclick="switchViewMode('admin')">
                        Dashboard <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-primary rounded-pill px-3" id="btnLoginUser">
                        <i class="fab fa-google me-2"></i>Login
                    </button>
                </div>

                <div class="glass-card animate__animated animate__zoomIn">
                    <form id="userForm">
                        <div class="mb-4">
                            <label class="fw-bold small text-muted text-uppercase mb-2">Hồ sơ nhân sự</label>
                            <select id="userSelect" class="form-select form-select-lg border-0 shadow-sm" required>
                                <option value="" selected disabled>Đang tải danh sách...</option>
                            </select>
                        </div>

                        <div id="formContent" style="opacity:0.5; pointer-events:none; transition:0.3s">
                            
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="inpName" placeholder="Tên" disabled>
                                        <label>Họ và Tên</label>
                                    </div>
                                    <div class="text-end mt-1 edit-btn-group"><i class="fas fa-pen text-secondary small cursor-pointer" onclick="toggleEdit('inpName')"></i></div>
                                </div>

                                <!-- ĐÃ XÓA MỤC BHXH Ở ĐÂY -->
                                
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="inpDob" placeholder="Dob" disabled>
                                        <label>Ngày sinh</label>
                                    </div>
                                    <div class="text-end mt-1 edit-btn-group"><i class="fas fa-pen text-secondary small cursor-pointer" onclick="toggleEdit('inpDob')"></i></div>
                                </div>

                                <div class="col-12">
                                    <div class="form-floating">
                                        <select class="form-select" id="inpGender" disabled>
                                            <option value="Nam">Nam</option>
                                            <option value="Nữ">Nữ</option>
                                        </select>
                                        <label>Giới tính</label>
                                    </div>
                                    <div class="text-end mt-1 edit-btn-group"><i class="fas fa-pen text-secondary small cursor-pointer" onclick="toggleEdit('inpGender')"></i></div>
                                </div>

                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="number" class="form-control" id="inpCccd" placeholder="CCCD" disabled>
                                        <label>CCCD</label>
                                    </div>
                                    <div class="text-end mt-1 edit-btn-group"><i class="fas fa-pen text-secondary small cursor-pointer" onclick="toggleEdit('inpCccd')"></i></div>
                                </div>
                            </div>

                            <div class="bg-white p-3 rounded-4 shadow-sm mb-4">
                                <h6 class="fw-bold text-primary mb-3 small text-uppercase">Tài khoản ngân hàng</h6>
                                <div class="mb-3">
                                    <label class="small fw-bold">Agribank <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-0"><img id="logoAgri" src="" height="20"></span>
                                        <input type="text" id="inpAgri" class="form-control bg-light border-0" placeholder="Số tài khoản..." required>
                                    </div>
                                </div>
                                <div>
                                    <label class="small fw-bold">Vietcombank</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-0"><img id="logoVcb" src="" height="20"></span>
                                        <input type="text" id="inpVcb" class="form-control bg-light border-0" placeholder="Nhập số tài khoản...">
                                    </div>
                                </div>
                            </div>

                            <button type="submit" id="btnSaveUser" class="btn btn-gradient w-100 py-3 shadow-lg">Lưu thông tin</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- B. ADMIN VIEW -->
            <div id="adminView" class="d-none animate__animated animate__fadeIn px-md-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 pt-4 pt-lg-0">
                    <h3 class="fw-bold text-dark m-0">Dashboard</h3>
                    <div class="d-flex gap-2 bg-white p-1 rounded-pill shadow-sm">
                        <input type="text" id="adminSearch" class="form-control border-0 shadow-none bg-transparent" placeholder="Tìm kiếm..." style="width: 180px;">
                        <button class="btn btn-dark rounded-circle" onclick="openAdminModal()"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <div class="glass-card d-flex align-items-center justify-content-between p-3">
                            <div>
                                <p class="text-muted small fw-bold text-uppercase mb-1">Tổng hồ sơ</p>
                                <h2 class="fw-bold m-0 text-dark" id="statTotal">0</h2>
                            </div>
                            <div class="bg-primary bg-opacity-10 p-2 rounded-circle text-primary"><i class="fas fa-users fa-lg"></i></div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="glass-card d-flex align-items-center justify-content-between p-3">
                            <div>
                                <p class="text-muted small fw-bold text-uppercase mb-1">Đã nhập</p>
                                <h2 class="fw-bold m-0 text-success" id="statDone">0</h2>
                            </div>
                            <div class="bg-success bg-opacity-10 p-2 rounded-circle text-success"><i class="fas fa-check-circle fa-lg"></i></div>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table custom-table mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>Nhân viên</th>
                                <th>Thông tin (BHXH, CCCD, NS)</th>
                                <th>TK Agribank</th>
                                <th>TK Vietcombank</th>
                                <th class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Admin Edit -->
    <div class="modal fade" id="adminModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg glass-popup">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Thông tin nhân sự</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="adminForm" class="row g-3">
                        <input type="hidden" id="editMode" value="add">
                        <input type="hidden" id="originalCccdAdmin"> 
                        
                        <div class="col-12">
                            <label class="small fw-bold">Họ và Tên</label>
                            <input type="text" id="admName" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold">Mã BHXH</label>
                            <input type="text" id="admBhxh" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold">Ngày sinh</label>
                            <input type="text" id="admDob" class="form-control" placeholder="DD/MM/YYYY">
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold">Giới tính</label>
                            <select id="admGender" class="form-select">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                         <div class="col-6">
                            <label class="small fw-bold">CCCD</label>
                            <input type="text" id="admCccd" class="form-control" required>
                        </div>

                        <div class="col-12 bg-light p-3 rounded-3 mt-2">
                            <label class="small fw-bold text-muted mb-2 d-block">Nhập hộ ngân hàng</label>
                            <div class="d-grid gap-2">
                                <input type="text" id="admAgri" class="form-control bg-white" placeholder="Agribank">
                                <input type="text" id="admVcb" class="form-control bg-white" placeholder="Vietcombank">
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: History -->
    <div class="modal fade" id="historyModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 glass-popup">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-history text-primary me-2"></i>Lịch sử chỉnh sửa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body bg-light rounded-bottom-4" style="max-height: 60vh; overflow-y: auto;">
                    <div id="historyList" class="d-flex flex-column gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, getDoc, addDoc, onSnapshot, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLCcgaoW9gNYhKk0c0gDWC6i5mKVTN4XE",
            authDomain: "profile-d1214.firebaseapp.com",
            projectId: "profile-d1214",
            storageBucket: "profile-d1214.firebasestorage.app",
            messagingSenderId: "914980131889",
            appId: "1:914980131889:web:72f8da15c42dbee671b110",
            measurementId: "G-C587M69LZW"
        };

        const ALLOWED_ADMINS = [
            "VYIs9XHLR9RMStwtcdwMrOIo33w1", 
            "ZQKPUtks4FgJUmllWytScYONuqF3",
        ];

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const COLL_DATA = "personnel_data";
        const COLL_LOGS = "audit_logs";
        const COLL_SETTINGS = "system_settings";

        let allUsers = [];
        let currentUser = null;
        let currentData = null;
        let bankLogoAgri = "", bankLogoVcb = "";
        let isEditAllowed = false;

        // UI References
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const contentArea = document.getElementById('contentArea');
        const userView = document.getElementById('userView');
        const adminView = document.getElementById('adminView');
        const btnLoginUser = document.getElementById('btnLoginUser');
        const btnToAdmin = document.getElementById('btnToAdmin');
        const toggleEditPermission = document.getElementById('toggleEditPermission');
        const adminSettingsArea = document.getElementById('adminSettingsArea');

        window.showToast = (title, icon = 'success') => {
            Swal.fire({
                title: title, icon: icon, showConfirmButton: false, timer: 1500,
                customClass: { popup: 'glass-popup' },
                showClass: { popup: 'animate__animated animate__zoomIn' },
                hideClass: { popup: 'animate__animated animate__zoomOut' }
            });
        }

        async function fetchLogos() {
            try {
                const r = await fetch('https://api.vietqr.io/v2/banks');
                const d = await r.json();
                const agri = d.data.find(b=>b.code=="VBA");
                const vcb = d.data.find(b=>b.code=="VCB");
                if(agri) { bankLogoAgri = agri.logo; document.getElementById('logoAgri').src = agri.logo; }
                if(vcb) { bankLogoVcb = vcb.logo; document.getElementById('logoVcb').src = vcb.logo; }
            } catch(e){}
        }
        fetchLogos();
        function showLoading(s) { document.getElementById('loading').style.display=s?'flex':'none'; }
        function parseDate(d) {
            if(!d) return new Date(0);
            const p = d.split('/');
            return p.length===3 ? new Date(p[2], p[1]-1, p[0]) : new Date(0);
        }
        function excelDateToJS(serial) {
            if (!serial) return "";
            if (typeof serial === 'string' && serial.includes('/')) return serial;
            const date_info = new Date((Math.floor(serial - 25569) * 86400) * 1000);
            return `${String(date_info.getDate()).padStart(2,'0')}/${String(date_info.getMonth()+1).padStart(2,'0')}/${date_info.getFullYear()}`;
        }

        function toggleSidebarMobile() { sidebar.classList.toggle('active'); overlay.classList.toggle('show'); }
        window.closeSidebarMobile = function() { sidebar.classList.remove('active'); overlay.classList.remove('show'); }
        sidebarToggle.addEventListener('click', toggleSidebarMobile);
        overlay.addEventListener('click', closeSidebarMobile);

        window.switchViewMode = function(mode) {
            closeSidebarMobile();
            if(mode === 'admin') {
                if(!currentUser) return;
                userView.classList.add('d-none');
                adminView.classList.remove('d-none');
                sidebar.classList.add('desktop-visible');
                contentArea.classList.add('desktop-shifted');
                sidebarToggle.style.display = 'block'; 
            } else {
                adminView.classList.add('d-none');
                userView.classList.remove('d-none');
                sidebar.classList.remove('desktop-visible');
                contentArea.classList.remove('desktop-shifted');
                sidebarToggle.style.display = 'none';
            }
        };

        // --- SETTINGS ---
        onSnapshot(doc(db, COLL_SETTINGS, "general_config"), (docSn) => {
            if (docSn.exists()) {
                isEditAllowed = docSn.data().allow_edit_info || false;
            } else {
                isEditAllowed = false; 
            }
            if(currentUser) toggleEditPermission.checked = isEditAllowed;
            updateUserEditUI();
        });

        function updateUserEditUI() {
            const editBtns = document.querySelectorAll('.edit-btn-group');
            editBtns.forEach(btn => {
                if(isEditAllowed) {
                    btn.style.display = 'block';
                } else {
                    btn.style.display = 'none';
                }
            });
            const currentVal = document.getElementById('userSelect').value;
            if(currentVal && !isEditAllowed) {
                // Đã xóa inpBhxh
                 ['inpName', 'inpDob', 'inpGender', 'inpCccd'].forEach(id => {
                     document.getElementById(id).disabled = true;
                 });
            }
        }

        toggleEditPermission.addEventListener('change', async function() {
            if(!currentUser) return;
            try {
                await setDoc(doc(db, COLL_SETTINGS, "general_config"), {
                    allow_edit_info: this.checked
                }, {merge: true});
                showToast(this.checked ? 'Đã bật quyền sửa' : 'Đã khóa quyền sửa');
            } catch(e) {
                console.error(e);
                showToast('Lỗi lưu cài đặt', 'error');
                this.checked = !this.checked;
            }
        });

        // --- AUTH ---
        onAuthStateChanged(auth, (user) => {
            if (user && ALLOWED_ADMINS.includes(user.uid)) {
                currentUser = user;
                document.getElementById('adminNameDisplay').textContent = user.displayName;
                btnLoginUser.style.display = 'none';
                btnToAdmin.style.display = 'block'; 
                adminSettingsArea.classList.remove('d-none');
                switchViewMode('admin');
            } else if (user) {
                currentUser = null;
                signOut(auth);
                showToast('Bạn không có quyền Admin.', 'warning');
                btnLoginUser.style.display = 'block';
                btnToAdmin.style.display = 'none';
                adminSettingsArea.classList.add('d-none');
                switchViewMode('user');
            } else {
                currentUser = null;
                btnLoginUser.style.display = 'block';
                btnToAdmin.style.display = 'none';
                adminSettingsArea.classList.add('d-none');
                switchViewMode('user');
            }
        });

        btnLoginUser.onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        // --- FETCH DATA (Reverted to Safe Method) ---
        onSnapshot(collection(db, COLL_DATA), (snapshot) => {
            const tempUsers = [];
            snapshot.forEach(doc => tempUsers.push(doc.data()));
            tempUsers.sort((a,b) => parseDate(a.dob) - parseDate(b.dob));
            allUsers = tempUsers;
            updateUserSelectOptions();
            renderAdminTable();
        });

        function updateUserSelectOptions() {
            const select = document.getElementById('userSelect');
            const currentVal = select.value;
            select.innerHTML = '<option value="" selected disabled>-- Tìm hồ sơ của bạn --</option>';
            allUsers.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.cccd; opt.textContent = u.name;
                select.appendChild(opt);
            });
            if(currentVal && allUsers.some(u=>u.cccd==currentVal)) select.value = currentVal;
        }

        document.getElementById('userSelect').onchange = function() {
            const selectedVal = String(this.value);
            currentData = allUsers.find(u => String(u.cccd) === selectedVal);
            
            if(currentData) {
                const form = document.getElementById('formContent');
                form.style.opacity="1"; form.style.pointerEvents="auto";
                
                // Đã xóa Bhxh khỏi mapping
                const mapping = {
                    'Name': 'name', 'Cccd': 'cccd', 'Dob': 'dob',
                    'Agri': 'agribank', 'Vcb': 'vietcombank'
                };
                
                for(let k in mapping) {
                    const el = document.getElementById('inp'+k);
                    let val = currentData[mapping[k]] || "";
                    el.value = val;
                    
                    if(k === 'Agri' || k === 'Vcb') {
                        el.disabled = false;
                    } else {
                        el.disabled = true; 
                    }
                }
                
                document.getElementById('inpGender').value = currentData.gender || 'Nam';
                document.getElementById('inpGender').disabled = true;
                
                updateUserEditUI(); 
            }
        };

        window.toggleEdit = (id) => {
            if(!isEditAllowed) return; 
            let el = document.getElementById(id);
            el.disabled = !el.disabled; 
            if(!el.disabled) el.focus();
        };
        
        // --- SAVE DATA (USER) ---
        document.getElementById('userForm').onsubmit = async(e) => {
            e.preventDefault();
            
            const btnSave = document.getElementById('btnSaveUser');
            const originalText = btnSave.innerHTML;
            btnSave.disabled = true;
            btnSave.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang lưu...';

            try {
                const newCccd = document.getElementById('inpCccd').value.trim();
                const oldCccd = currentData.cccd;
                
                // User View không có input BHXH, nên ta lấy giá trị cũ từ DB
                const preservedBhxh = currentData.bhxh || "";

                const data = {
                    cccd: newCccd,
                    name: document.getElementById('inpName').value,
                    bhxh: preservedBhxh, // Giữ nguyên BHXH
                    dob: document.getElementById('inpDob').value,
                    gender: document.getElementById('inpGender').value,
                    agribank: document.getElementById('inpAgri').value,
                    vietcombank: document.getElementById('inpVcb').value
                };
                
                await saveData(oldCccd, data, currentData);
            } catch(err) {
                console.error(err);
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = originalText;
            }
        };

        async function saveData(oldCccd, newData, oldData) {
            const newCccd = newData.cccd;
            const changes = [];
            const editor = currentUser ? `Admin: ${currentUser.displayName}` : "Khách";
            const fieldMap = {
                'name': 'Họ tên', 'bhxh': 'Mã BHXH', 'dob': 'Ngày sinh', 'gender': 'Giới tính',
                'agribank': 'TK Agribank', 'vietcombank': 'TK Vietcombank', 'cccd': 'CCCD'
            };

            for(let k in newData) {
                if((oldData?.[k]||"") != (newData[k]||"")) {
                    changes.push({
                        field: fieldMap[k] || k, 
                        old: oldData?.[k]||"(Trống)", 
                        new: newData[k]
                    });
                }
            }

            try {
                if (oldCccd !== newCccd) {
                    const snap = await getDoc(doc(db, COLL_DATA, newCccd));
                    if(snap.exists()) throw new Error(`CCCD mới (${newCccd}) đã tồn tại!`);

                    await setDoc(doc(db, COLL_DATA, newCccd), {...newData, last_updated:new Date().toISOString()});
                    if(changes.length>0) {
                        await addDoc(collection(db, COLL_LOGS), {
                            cccd_ref: newCccd, editor: editor, time: new Date().toISOString(), details: changes
                        });
                    }
                    if(oldCccd) await deleteDoc(doc(db, COLL_DATA, oldCccd));
                    if(!currentUser) { currentData = {...newData}; document.getElementById('userSelect').value = newCccd; }

                } else {
                    await setDoc(doc(db, COLL_DATA, oldCccd), {...newData, last_updated:new Date().toISOString()}, {merge:true});
                    if(changes.length>0) {
                        await addDoc(collection(db, COLL_LOGS), {
                            cccd_ref: oldCccd, editor: editor, time: new Date().toISOString(), details: changes
                        });
                    }
                }
                showToast('Lưu thành công!');
                bootstrap.Modal.getInstance(document.getElementById('adminModal'))?.hide();
            } catch(e) { showToast(e.message, 'error'); } 
        }

        // --- ADMIN RENDER ---
        function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            const term = document.getElementById('adminSearch').value.toLowerCase();
            tbody.innerHTML = '';
            const filtered = allUsers.filter(u => u.name?.toLowerCase().includes(term) || u.cccd?.includes(term));
            
            document.getElementById('statTotal').innerText = allUsers.length;
            document.getElementById('statDone').innerText = allUsers.filter(u=>u.agribank).length;

            filtered.forEach(u => {
                const tr = document.createElement('tr');
                const avatar = u.name.charAt(0).toUpperCase();
                const agri = u.agribank ? `<span class="badge bg-light text-dark border"><img src="${bankLogoAgri}" height="36"> ${u.agribank}</span>` : '<span class="text-muted small">-</span>';
                const vcb = u.vietcombank ? `<span class="badge bg-light text-dark border"><img src="${bankLogoVcb}" height="36"> ${u.vietcombank}</span>` : '<span class="text-muted small">-</span>';
                
                const bhxhDisplay = u.bhxh ? `<div class="small"><i class="fas fa-id-card text-muted me-1"></i>BHXH: ${u.bhxh}</div>` : '';

                tr.innerHTML = `
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="avatar me-3" style="width:35px;height:35px;background:#6c5ce7;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;">${avatar}</div>
                            <div>
                                <div class="fw-bold">${u.name}</div>
                                <small class="text-muted">${u.gender || 'Nam'}</small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="fw-bold text-dark"><i class="far fa-id-badge text-muted me-1"></i>${u.cccd}</div>
                        ${bhxhDisplay}
                        <div class="small text-muted"><i class="fas fa-birthday-cake text-muted me-1"></i>${u.dob}</div>
                    </td>
                    <td>${agri}</td>
                    <td>${vcb}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-info border-0 rounded-circle" title="Lịch sử" onclick="viewHistoryByCccd('${u.cccd}')"><i class="fas fa-history"></i></button>
                        <button class="btn btn-sm btn-outline-primary border-0 rounded-circle" title="Sửa" onclick="editUser('${u.cccd}')"><i class="fas fa-pen"></i></button>
                        <button class="btn btn-sm btn-outline-danger border-0 rounded-circle" title="Xóa" onclick="delUser('${u.cccd}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.getElementById('adminSearch').onkeyup = renderAdminTable;

        window.openAdminModal = () => {
            document.getElementById('adminForm').reset();
            document.getElementById('editMode').value='add';
            document.getElementById('originalCccdAdmin').value='';
            document.getElementById('admCccd').readOnly=false;
            new bootstrap.Modal(document.getElementById('adminModal')).show();
        };

        window.editUser = (cccd) => {
            const u = allUsers.find(x=>x.cccd==cccd);
            document.getElementById('editMode').value='update';
            document.getElementById('originalCccdAdmin').value = u.cccd; 
            
            document.getElementById('admCccd').value=u.cccd; 
            document.getElementById('admName').value=u.name;
            document.getElementById('admBhxh').value=u.bhxh || "";
            document.getElementById('admDob').value=u.dob;
            document.getElementById('admGender').value=u.gender||'Nam';
            document.getElementById('admAgri').value=u.agribank||"";
            document.getElementById('admVcb').value=u.vietcombank||"";
            new bootstrap.Modal(document.getElementById('adminModal')).show();
        };

        document.getElementById('adminForm').onsubmit = async(e) => {
            e.preventDefault();
            const newCccd = document.getElementById('admCccd').value.trim();
            const oldCccd = document.getElementById('editMode').value === 'add' ? null : document.getElementById('originalCccdAdmin').value;
            const oldData = oldCccd ? (allUsers.find(u=>u.cccd==oldCccd) || {}) : {};

            const data = {
                cccd: newCccd,
                name: document.getElementById('admName').value,
                bhxh: document.getElementById('admBhxh').value,
                dob: document.getElementById('admDob').value,
                gender: document.getElementById('admGender').value,
                agribank: document.getElementById('admAgri').value,
                vietcombank: document.getElementById('admVcb').value
            };
            await saveData(oldCccd, data, oldData);
        };

        window.delUser = async(cccd) => {
            if((await Swal.fire({title:'Xóa?',icon:'warning',showCancelButton:true,customClass:{popup:'glass-popup'}})).isConfirmed) {
                await deleteDoc(doc(db, COLL_DATA, cccd));
                showToast('Đã xóa');
            }
        };

        window.handleImport = () => {
            const f = document.getElementById('fileExcel').files[0];
            if(!f) return;
            showLoading(true);
            const r = new FileReader();
            r.onload = async(e) => {
                const wb = XLSX.read(e.target.result, {type:'array'});
                const d = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                for(let row of d) {
                    let cccd=row['CCCD']||row['cccd'];
                    if(cccd) {
                        cccd=String(cccd);
                        let dob = row['Ngày sinh']||row['DOB']||"";
                        if(typeof dob==='number') dob=excelDateToJS(dob);
                        
                        await setDoc(doc(db, COLL_DATA, cccd), {
                            cccd, 
                            name: row['Họ tên']||row['Name'],
                            bhxh: row['Mã BHXH']||row['BHXH']||"",
                            dob: dob, 
                            gender: row['Giới tính']||'Nam'
                        }, {merge:true});
                    }
                }
                showLoading(false); showToast('Import thành công'); document.getElementById('fileExcel').value='';
            };
            r.readAsArrayBuffer(f);
        };
        
        window.exportExcel = () => {
            const d = allUsers.map(u=>({
                "Họ tên":u.name, "Mã BHXH":u.bhxh, "Ngày sinh":u.dob, "Giới tính":u.gender, "CCCD":u.cccd,
                "Agribank":u.agribank, "Vietcombank":u.vietcombank
            }));
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d), "Data");
            XLSX.writeFile(wb, "Data_Export.xlsx");
        };

        async function fetchAndShowHistory(cccd) {
            const q = query(collection(db, COLL_LOGS), where("cccd_ref","==",cccd), orderBy("time","desc"));
            const snap = await getDocs(q);
            const div = document.getElementById('historyList');
            div.innerHTML = snap.empty ? "<p class='text-center text-muted my-3'>Chưa có lịch sử thay đổi nào.</p>" : "";
            
            snap.forEach(d=>{
                const l = d.data();
                const det = l.details.map(x=>`
                    <div class="d-flex align-items-center justify-content-between border-bottom py-2">
                        <span class="fw-bold text-dark small">${x.field}</span>
                        <div class="text-end small">
                            <span class="text-muted text-decoration-line-through me-2">${x.old}</span>
                            <i class="fas fa-arrow-right text-secondary small me-2"></i>
                            <span class="text-success fw-bold">${x.new}</span>
                        </div>
                    </div>
                `).join('');
                
                div.innerHTML += `
                    <div class='history-item bg-white p-3 rounded shadow-sm'>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge bg-primary bg-opacity-10 text-primary">${l.editor}</span>
                            <small class="text-muted">${new Date(l.time).toLocaleString()}</small>
                        </div>
                        <div class='bg-light rounded p-2'>${det}</div>
                    </div>`;
            });
            new bootstrap.Modal(document.getElementById('historyModal')).show();
        }

        window.viewHistory = () => { if(currentData) fetchAndShowHistory(currentData.cccd); };
        window.viewHistoryByCccd = (cccd) => { fetchAndShowHistory(cccd); };

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
