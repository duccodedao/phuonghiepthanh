<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Văn bản & Biểu mẫu - Vĩnh Trạch Đông</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="Hệ thống quản lý, lưu trữ và chia sẻ văn bản, biểu mẫu hành chính.">
    <link rel="icon" href="https://hdd.io.vn/img/bmassloadings.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Excel Library (SheetJS) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- ZIP & FileSaver Libraries (Mới) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#2563eb', secondary: '#f43f5e', dark: '#0f172a' } } }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; transition: background 0.3s; } 
        .dark body { background-color: #0f172a; color: #e2e8f0; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .dark .glass { background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .admin-sidebar { 
            width: 24rem; transform: translateX(100%); transition: transform 0.3s ease-in-out;
        }
        .admin-sidebar.open { transform: translateX(0); }
        @media (max-width: 768px) { .admin-sidebar { width: 100%; } }

        /* Custom Loading */
        .loader { width: 24px; height: 24px; border: 3px solid #e2e8f0; border-bottom-color: #2563eb; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Drag Zone */
        .drag-active { border-color: #2563eb !important; background-color: rgba(37, 99, 235, 0.05) !important; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Loading Overlay -->
    <div id="global-loading" class="fixed inset-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm z-[900] flex flex-col items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
        <span class="loader mb-4"></span>
        <span id="loading-text" class="text-sm font-bold text-slate-600 dark:text-slate-300">Đang xử lý...</span>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-[100] glass px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center text-primary">
                <i data-lucide="file-text" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-sm font-black uppercase tracking-wider">KHO VĂN BẢN</h1>
                <span id="role-status" class="text-[10px] font-bold text-slate-400">GUEST</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="window.toggleAdminSidebar()" id="admin-btn" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hidden">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
            </button>
            <button onclick="window.toggleTheme()" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            </button>
            <div id="auth-section"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6 space-y-8">
        
        <!-- Search & Filter -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-end md:items-center">
            <div class="relative w-full md:w-96 group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4 group-focus-within:text-primary transition"></i>
                <input type="text" id="search-input" placeholder="Tìm kiếm văn bản, biểu mẫu..." 
                    class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/5 rounded-xl focus:ring-2 ring-primary/50 outline-none shadow-sm text-sm font-medium transition">
            </div>
            
            <!-- User Action Buttons -->
            <div class="flex gap-2">
                <button onclick="window.downloadZipAll()" class="flex items-center gap-2 px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold text-xs uppercase shadow-lg transition">
                    <i data-lucide="archive" class="w-4 h-4"></i> Tải trọn bộ (ZIP)
                </button>
                <button onclick="window.exportToExcel()" class="flex items-center gap-2 px-4 py-3 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border dark:border-white/10 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-xs uppercase shadow-sm transition">
                    <i data-lucide="sheet" class="w-4 h-4 text-green-600"></i> Xuất Excel
                </button>
            </div>
        </div>

        <!-- Document List -->
        <div id="doc-container" class="grid grid-cols-1 gap-3">
            <!-- Items rendered by JS -->
        </div>
        
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-slate-400">
            <i data-lucide="folder-open" class="w-16 h-16 mb-4 opacity-50"></i>
            <p class="font-medium">Không tìm thấy tài liệu nào.</p>
        </div>

    </main>

    <!-- Admin Sidebar -->
    <div id="admin-sidebar" class="admin-sidebar fixed right-0 top-0 bottom-0 bg-white dark:bg-slate-900 border-l dark:border-white/10 shadow-2xl z-[200] flex flex-col">
        <div class="p-6 border-b dark:border-white/5 flex justify-between items-center">
            <h3 class="font-black uppercase text-sm tracking-widest text-primary">Quản trị viên</h3>
            <button onclick="window.toggleAdminSidebar()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div class="p-4 border-b dark:border-white/5">
            <button onclick="window.openUploadModal()" class="w-full py-3 bg-primary text-white rounded-xl font-bold uppercase text-xs shadow-lg flex items-center justify-center gap-2 hover:bg-blue-600 transition">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i> Thêm Văn Bản Mới
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-8">
            <!-- Github Settings -->
            <div class="space-y-4">
                <h4 class="text-xs font-black uppercase tracking-widest text-slate-500 border-b pb-2">Cấu hình GitHub (Lưu trữ)</h4>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase text-slate-400">Token (Repo Scope)</label>
                    <input type="password" id="gh-token" placeholder="ghp_..." class="w-full px-4 py-2 bg-slate-50 dark:bg-white/5 rounded-lg text-sm border dark:border-white/5 outline-none focus:border-primary">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase text-slate-400">Tên tài khoản (Owner)</label>
                    <input type="text" id="gh-owner" placeholder="vd: nguyenvana" class="w-full px-4 py-2 bg-slate-50 dark:bg-white/5 rounded-lg text-sm border dark:border-white/5 outline-none focus:border-primary">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase text-slate-400">Tên Repository</label>
                    <input type="text" id="gh-repo" placeholder="vd: kho-van-ban" class="w-full px-4 py-2 bg-slate-50 dark:bg-white/5 rounded-lg text-sm border dark:border-white/5 outline-none focus:border-primary">
                </div>
                <button onclick="window.saveGithubConfig()" class="w-full py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-white rounded-lg text-xs font-bold uppercase">Lưu cấu hình</button>
            </div>

            <!-- Stats -->
            <div class="space-y-4">
                <h4 class="text-xs font-black uppercase tracking-widest text-slate-500 border-b pb-2">Thống kê</h4>
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3 bg-slate-50 dark:bg-white/5 rounded-lg text-center">
                        <span id="stat-total" class="text-xl font-black text-primary block">0</span>
                        <span class="text-[10px] uppercase text-slate-400 font-bold">Tổng file</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="modal-upload" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden border dark:border-white/10">
            <div class="p-5 border-b dark:border-white/5 flex justify-between items-center">
                <h3 class="font-bold uppercase text-sm tracking-widest">Tải lên Văn bản</h3>
                <button onclick="window.closeModal('modal-upload')" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="upload-form" class="p-6 space-y-4">
                <!-- Drag & Drop Area -->
                <div id="drop-zone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition relative">
                    <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer" required>
                    <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 mb-2"></i>
                    <p class="text-sm font-bold text-slate-600 dark:text-slate-300">Kéo thả file vào đây</p>
                    <p class="text-xs text-slate-400 mt-1">hoặc click để chọn file</p>
                    <p id="file-selected-name" class="mt-3 text-xs font-bold text-primary break-all"></p>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Tên hiển thị</label>
                    <input type="text" id="doc-name" required placeholder="Tự động điền khi chọn file..." class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                </div>
                
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Số hiệu / Ghi chú</label>
                    <input type="text" id="doc-note" placeholder="VD: 123/UBND-VTD" class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 rounded-xl text-sm font-medium outline-none focus:ring-2 ring-primary">
                </div>

                <button type="submit" class="w-full py-3 bg-primary text-white rounded-xl font-bold shadow-lg uppercase text-xs hover:bg-blue-600 transition">Xác nhận Tải lên</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-[500] translate-y-20 opacity-0 transition-all duration-300">
        <div class="bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-bold text-sm">
            <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>
            <span id="toast-msg">Thông báo</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- CẤU HÌNH FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCLCcgaoW9gNYhKk0c0gDWC6i5mKVTN4XE", // Thay bằng API Key của bạn
            authDomain: "profile-d1214.firebaseapp.com",
            projectId: "profile-d1214",
            storageBucket: "profile-d1214.firebasestorage.app",
            messagingSenderId: "914980131889",
            appId: "1:914980131889:web:72f8da15c42dbee671b110"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let isAdmin = false;
        let documents = [];
        let ghConfig = { token: '', owner: '', repo: '' };

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            renderAuthUI();
            
            if (user) {
                // Check Admin (Cơ chế đơn giản: Có trong collection 'settings/admins' hoặc check cứng email)
                // Ở đây mình sẽ giả lập check email hoặc bạn set quyền trong Firestore
                const adminRef = doc(db, "settings", "admins");
                const snap = await getDoc(adminRef);
                if (snap.exists()) {
                    const data = snap.data();
                    isAdmin = (data.super_uid === user.uid) || (data.deputy_emails && data.deputy_emails.includes(user.email));
                }
                
                // Load Github Config nếu là Admin
                if (isAdmin) {
                    const ghRef = doc(db, "settings", "github_config");
                    const ghSnap = await getDoc(ghRef);
                    if (ghSnap.exists()) {
                        ghConfig = ghSnap.data();
                        document.getElementById('gh-token').value = ghConfig.token || '';
                        document.getElementById('gh-owner').value = ghConfig.owner || '';
                        document.getElementById('gh-repo').value = ghConfig.repo || '';
                    }
                    document.getElementById('admin-btn').classList.remove('hidden');
                }
            } else {
                isAdmin = false;
                document.getElementById('admin-btn').classList.add('hidden');
            }
            renderDocs();
        });

        // --- UI LOGIC ---
        function renderAuthUI() {
            const container = document.getElementById('auth-section');
            if (currentUser) {
                container.innerHTML = `
                    <div class="flex items-center gap-2 bg-white dark:bg-slate-800 p-1 pr-3 rounded-xl border dark:border-white/10 shadow-sm cursor-pointer" onclick="window.logout()">
                        <img src="${currentUser.photoURL}" class="w-8 h-8 rounded-lg">
                        <div class="hidden sm:block">
                            <p class="text-[10px] font-bold text-slate-400 uppercase leading-none">Hi,</p>
                            <p class="text-xs font-bold leading-none truncate max-w-[100px]">${currentUser.displayName}</p>
                        </div>
                        <i data-lucide="log-out" class="w-4 h-4 text-red-500 ml-1"></i>
                    </div>
                `;
            } else {
                container.innerHTML = `<button onclick="window.login()" class="px-5 py-2 bg-primary text-white rounded-xl font-bold text-xs uppercase shadow-lg hover:bg-blue-600 transition">Đăng nhập</button>`;
            }
            lucide.createIcons();
        }

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());

        window.toggleAdminSidebar = () => document.getElementById('admin-sidebar').classList.toggle('open');
        window.toggleTheme = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        };
        
        // --- REALTIME DATA ---
        onSnapshot(query(collection(db, "documents"), orderBy("timestamp", "desc")), (snap) => {
            documents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('stat-total').innerText = documents.length;
            renderDocs();
        });

        function renderDocs() {
            const container = document.getElementById('doc-container');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = documents.filter(d => d.name.toLowerCase().includes(search) || (d.note && d.note.toLowerCase().includes(search)));
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            
            document.getElementById('empty-state').classList.add('hidden');
            container.innerHTML = filtered.map(doc => {
                const date = new Date(doc.timestamp).toLocaleDateString('vi-VN');
                const fileSize = (doc.size / 1024).toFixed(1) + ' KB';
                const fileExt = doc.fileName.split('.').pop().toUpperCase();
                
                let iconColor = 'text-slate-500';
                if(['DOC','DOCX'].includes(fileExt)) iconColor = 'text-blue-500';
                if(['XLS','XLSX'].includes(fileExt)) iconColor = 'text-green-500';
                if(['PDF'].includes(fileExt)) iconColor = 'text-red-500';
                if(['ZIP','RAR'].includes(fileExt)) iconColor = 'text-yellow-500';

                return `
                <div class="group bg-white dark:bg-slate-800 p-4 rounded-xl border dark:border-white/5 shadow-sm hover:shadow-md transition flex items-center gap-4">
                    <div class="w-12 h-12 bg-slate-50 dark:bg-slate-700 rounded-lg flex items-center justify-center flex-shrink-0">
                        <span class="text-[10px] font-black ${iconColor}">${fileExt}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-bold truncate text-slate-800 dark:text-slate-200">${doc.name}</h4>
                        <div class="flex items-center gap-2 mt-1">
                            ${doc.note ? `<span class="bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded text-[10px] font-bold text-slate-500 uppercase">${doc.note}</span>` : ''}
                            <span class="text-[10px] text-slate-400 font-medium">${date} • ${fileSize}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="${doc.downloadUrl}" target="_blank" download class="p-2 text-primary bg-primary/10 hover:bg-primary hover:text-white rounded-lg transition" title="Tải xuống">
                            <i data-lucide="download" class="w-5 h-5"></i>
                        </a>
                        ${isAdmin ? `<button onclick="window.deleteDocConfirm('${doc.id}', '${doc.name}', '${doc.githubPath}', '${doc.sha}')" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-slate-700 rounded-lg transition"><i data-lucide="trash-2" class="w-5 h-5"></i></button>` : ''}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }
        
        document.getElementById('search-input').oninput = renderDocs;

        // --- GITHUB INTEGRATION ---
        
        // Helper: Convert File to Base64 (Strip prefix)
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        window.saveGithubConfig = async () => {
            if (!isAdmin) return;
            const token = document.getElementById('gh-token').value.trim();
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            
            await setDoc(doc(db, "settings", "github_config"), { token, owner, repo });
            ghConfig = { token, owner, repo };
            showToast("Đã lưu cấu hình GitHub!");
        };

        // --- UPLOAD LOGIC ---
        window.openUploadModal = () => {
            if (!ghConfig.token) { showToast("Vui lòng cấu hình GitHub trước!", true); window.toggleAdminSidebar(); return; }
            document.getElementById('modal-upload').classList.remove('hidden');
        };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        // Drag & Drop Handling
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files; // Sync with input
            handleFiles();
        }

        function handleFiles() {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                document.getElementById('file-selected-name').innerText = `Đã chọn: ${file.name}`;
                // Auto fill name if empty
                if (!document.getElementById('doc-name').value) {
                    // Remove extension for display name
                    const nameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
                    document.getElementById('doc-name').value = nameWithoutExt;
                }
            }
        }

        document.getElementById('upload-form').onsubmit = async (e) => {
            e.preventDefault();
            if (fileInput.files.length === 0) { showToast("Chưa chọn file!", true); return; }
            const file = fileInput.files[0];
            const display_name = document.getElementById('doc-name').value;
            const note = document.getElementById('doc-note').value;

            setLoading(true);
            try {
                // 1. Upload to GitHub
                const content = await toBase64(file);
                const path = `docs/${Date.now()}_${file.name}`; // Unique path
                const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${path}`;
                
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${ghConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload ${file.name} via Hub Portal`,
                        content: content,
                        branch: 'main' // hoặc 'master' tùy repo
                    })
                });

                if (!response.ok) throw new Error("GitHub Upload Failed: " + response.statusText);
                const ghData = await response.json();

                // 2. Save Metadata to Firestore
                await addDoc(collection(db, "documents"), {
                    name: display_name,
                    note: note,
                    fileName: file.name,
                    size: file.size,
                    type: file.type,
                    downloadUrl: ghData.content.download_url, // Link tải trực tiếp (Raw)
                    githubPath: path,
                    sha: ghData.content.sha, // Cần SHA để xóa sau này
                    timestamp: new Date().toISOString(),
                    uploadedBy: currentUser.email
                });

                showToast("Tải lên thành công!");
                window.closeModal('modal-upload');
                document.getElementById('upload-form').reset();
                document.getElementById('file-selected-name').innerText = '';

            } catch (error) {
                console.error(error);
                showToast("Lỗi: " + error.message, true);
            } finally {
                setLoading(false);
            }
        };

        // --- DELETE LOGIC ---
        window.deleteDocConfirm = (id, name, path, sha) => {
            if(confirm(`Bạn có chắc chắn muốn xóa "${name}" không?`)) {
                deleteDocument(id, path, sha);
            }
        };

        async function deleteDocument(id, path, sha) {
            setLoading(true);
            try {
                // 1. Delete from GitHub
                const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${path}`;
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${ghConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Delete via Hub Portal",
                        sha: sha,
                        branch: 'main'
                    })
                });

                if (!response.ok) console.warn("GitHub Delete Warning (File might be already gone):", response.statusText);

                // 2. Delete from Firestore
                await deleteDoc(doc(db, "documents", id));
                showToast("Đã xóa văn bản!");
            } catch (error) {
                showToast("Lỗi khi xóa: " + error.message, true);
            } finally {
                setLoading(false);
            }
        }

        // --- EXPORT FEATURES ---
        
        // 1. Export Excel (Metadata Only)
        window.exportToExcel = () => {
            if (documents.length === 0) { showToast("Không có dữ liệu để xuất!", true); return; }
            
            const data = documents.map((d, i) => ({
                STT: i + 1,
                "Tên văn bản": d.name,
                "Ghi chú/Số hiệu": d.note || "",
                "Tên file gốc": d.fileName,
                "Kích thước (KB)": (d.size / 1024).toFixed(2),
                "Ngày đăng": new Date(d.timestamp).toLocaleString('vi-VN'),
                "Link tải": d.downloadUrl
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Danh sách văn bản");
            XLSX.writeFile(wb, `Danh_sach_van_ban_${Date.now()}.xlsx`);
            showToast("Đã xuất file Excel!");
        };

        // 2. Download All as ZIP
        window.downloadZipAll = async () => {
            if (documents.length === 0) { showToast("Không có file để tải!", true); return; }
            
            setLoading(true, "Đang nén file (Có thể mất vài phút)...");
            const zip = new JSZip();
            const folder = zip.folder("Van_Ban_VTD");
            
            try {
                // Lấy tất cả file. Lưu ý: Fetch từ GitHub Raw có thể bị CORS nếu không cấu hình.
                // Tuy nhiên, GitHub Raw thường cho phép GET simple requests.
                // Nếu bị chặn, cần dùng Proxy hoặc GitHub API Get Content (nhưng API có rate limit).
                
                const promises = documents.map(async (doc) => {
                    try {
                        const response = await fetch(doc.downloadUrl);
                        if (!response.ok) throw new Error("Fetch fail");
                        const blob = await response.blob();
                        folder.file(doc.fileName, blob);
                    } catch (e) {
                        console.error(`Lỗi tải file ${doc.name}:`, e);
                        // Tạo file text báo lỗi thay thế
                        folder.file(`${doc.name}_ERROR.txt`, `Không thể tải file này. Link gốc: ${doc.downloadUrl}`);
                    }
                });

                await Promise.all(promises);
                
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, `Kho_Van_Ban_Full_${Date.now()}.zip`);
                showToast("Đã tải xuống trọn bộ!");

            } catch (e) {
                console.error(e);
                showToast("Lỗi khi tạo file ZIP!", true);
            } finally {
                setLoading(false);
            }
        };

        // --- UTILS ---
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            
            icon.setAttribute('data-lucide', isError ? 'alert-triangle' : 'check-circle');
            icon.classList.toggle('text-red-500', isError);
            icon.classList.toggle('text-green-500', !isError);
            lucide.createIcons();

            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function setLoading(active, text = "Đang xử lý...") {
            const l = document.getElementById('global-loading');
            document.getElementById('loading-text').innerText = text;
            if (active) {
                l.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                l.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
        lucide.createIcons();
    </script>
</body>
</html>
